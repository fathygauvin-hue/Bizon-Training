°<!DOCTYPE html>

<style>
/* ============ RESET & TOKENS ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--w);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

:root{
  --font-body:'Inter',system-ui,sans-serif;
  --gold:#C9A227;--gold2:#E7C34B;--gold3:#C9A227;--gold4:rgba(201,162,39,0.13);
  --bg:#0a0a0a;--s1:#141412;--s2:#1f1f1c;--s3:#282824;--s4:#32322e;
  --w:#faf9f6;--w2:#c2c0b8;--w3:#8c8c84;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --green:#7BC47A;--green-bg:rgba(59,109,17,0.22);
  --red:#E07070;--red-bg:rgba(162,45,45,0.22);
  --blue:#7BAEE0;--blue-bg:rgba(24,95,165,0.2);
  --r8:8px;--r12:12px;--r16:16px;--r20:20px;--r24:24px;--r26:26px;
  --orange:#F08A5A;--orange2:#F5A87A;--orange-bg:rgba(240,138,90,0.16);
  --font-display:'Bebas Neue',sans-serif;--font-num:'Big Shoulders Display',sans-serif;--font-btn:'Space Grotesk',sans-serif;
}

#auth-root,#app-shell{background:var(--bg);min-height:100vh;width:100%;font-family:'Inter',sans-serif}
#app-shell{display:none;flex-direction:column}
#auth-root{display:none}
.app-frame{width:100%;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.bar-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:center;padding:0 32px;height:100%}
.botnav-inner{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center}

#topbar{height:60px;background:var(--s1);border-bottom:.5px solid var(--border);flex-shrink:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;max-width:1200px;margin:0 auto;width:100%;padding:0 32px}

.nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 0;user-select:none}
.nt svg{transition:stroke .2s}
.nt span{font-size:9px;color:var(--w3);letter-spacing:.6px;text-transform:uppercase;font-weight:500;transition:color .2s}
.nt.on svg{stroke:var(--gold)}
.nt.on span{color:var(--gold)}
.sec{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);letter-spacing:2px;padding:18px 16px 8px}
.acc-head{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);letter-spacing:2px;padding:18px 16px 8px;cursor:pointer;display:flex;align-items:center;gap:8px;user-select:none}
.acc-arrow{display:inline-block;font-size:12px;transition:transform .15s}
.skel-bar{display:inline-block;width:70px;height:11px;border-radius:5px;vertical-align:middle;background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 37%,var(--s2) 63%);background-size:400% 100%;animation:skel-pulse 1.4s ease infinite}

.card{background:var(--s2);border:.5px solid var(--border);border-radius:var(--r20);padding:16px;margin:0 14px 12px;box-shadow:0 4px 16px rgba(0,0,0,0.22)}
.pill{display:inline-flex;align-items:center;background:var(--gold4);border:.5px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--gold2);font-weight:500}
.tag{display:inline-flex;align-items:center;border-radius:var(--r12);padding:2px 8px;font-size:11px;font-weight:500}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.a{background:var(--gold4);color:var(--gold2)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.bignum{font-family:var(--font-num);font-weight:800}

.gbtn{background:var(--gold);color:#0a0a0a;font-family:var(--font-btn);font-weight:700;font-size:13px;padding:10px 16px;border-radius:var(--r16);border:1px solid transparent;cursor:pointer;transition:background .15s}

/* bandeaux etat (hors ligne / envoi) */
#app-banners{position:fixed;left:0;right:0;top:68px;z-index:55;pointer-events:none;padding:0 14px;display:flex;flex-direction:column;gap:8px;max-width:620px;margin:0 auto}

.banner{display:flex;align-items:flex-start;gap:11px;background:var(--s2);border:.5px solid var(--border);border-radius:var(--r16);padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

@media (min-width:1000px){
  .app-frame{display:grid;grid-template-columns:252px 1fr;grid-template-rows:auto 1fr auto;height:100vh;min-height:100vh}
  #topbar{grid-column:1;grid-row:1;height:auto;background:transparent;border-bottom:none;padding:24px 18px 12px;flex-shrink:0}
  #topbar .bar-inner{justify-content:flex-start;padding:0;height:auto;max-width:none}
  #botnav{grid-column:1;grid-row:2;height:auto;background:transparent;border-top:none;padding:6px 12px;align-self:start;flex-shrink:0}
  #botnav .botnav-inner{flex-direction:column;align-items:stretch;gap:4px;max-width:none}
  .nt{flex:none;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r16)}
  .nt span{font-size:13.5px;letter-spacing:.3px;text-transform:none;font-weight:500}
  .nt.on{background:var(--s2)}
  #content{grid-column:2;grid-row:1 / span 3;min-height:0;max-width:1180px;padding:0 30px 20px;border-left:.5px solid var(--border)}
  #rail-foot{display:block;grid-column:1;grid-row:3;align-self:end;padding:12px 12px 18px}
  #fab{display:none !important}
  #home-actions{display:flex}
  #app-banners{top:16px;left:auto;right:24px;margin:0;max-width:390px;padding:0}
  #home-week-stats{display:none}

}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

<body>

<script>
/* ==========================================================
   API — toutes les opérations Supabase passent par l'Edge Function "api"
   (le code d'accès est vérifié côté serveur, la clé anon ne donne plus
   aucun accès direct aux tables : voir RLS + revoke sur profiles/videos)
========================================================== */
const SUPABASE_URL = "https://shwtjplbjirgkgjtxrap.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tZk7-W_5TusA_hMtrtvhhA_9Fedr8cP";
const EDGE_FN_URL = "https://shwtjplbjirgkgjtxrap.supabase.co/functions/v1/api";

const NET = { offline: (typeof navigator !== 'undefined' && navigator.onLine === false), lastSync: Number(localStorage.getItem('bzc_last') || 0) || null };
const CACHEABLE = /^(get|list)/;
function cacheKey(action, payload){ try { return 'bzc_' + action + '_' + JSON.stringify(payload); } catch(e){ return 'bzc_' + action; } }
function isNetworkError(e){
  return (e instanceof TypeError) || /Failed to fetch|NetworkError|Load failed|network/i.test(e && e.message || '');
}
function setOffline(v){
  if(NET.offline === v) return;
  NET.offline = v;
  if(typeof renderBanners === 'function') renderBanners();
  if(!v && typeof pumpUploads === 'function') pumpUploads();
  if(typeof render === 'function' && typeof CURRENT !== 'undefined' && CURRENT.screen === 'biblio') render();
}
async function callApi(action, payload = {}) {
  const code = APP_STATE.code || localStorage.getItem('bizon_access_code') || '';
  const key = cacheKey(action, payload);
  try {
    const res = await fetch(EDGE_FN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'apikey': SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ action, code, ...payload }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    setOffline(false);
    if (CACHEABLE.test(action)) {
      try {
        localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: data }));
        NET.lastSync = Date.now();
        localStorage.setItem('bzc_last', String(NET.lastSync));
      } catch(e) { /* quota : on ignore */ }
    }
    return data;
  } catch(e) {
    if (isNetworkError(e)) {
      setOffline(true);
      if (CACHEABLE.test(action)) {
        const raw = localStorage.getItem(key);
        if (raw) { try { return JSON.parse(raw).d; } catch(e2){} }
      }
    }
    throw e;
  }
}

// Upload direct du fichier vers Supabase Storage via une URL signée à usage unique
// (obtenue depuis l'Edge Function "api" — le token autorise uniquement CET upload précis).
async function uploadToSignedUrl(path, token, file) {
  const url = `${SUPABASE_URL}/storage/v1/object/upload/sign/athlete-videos/${path}?token=${token}`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': file.type || 'video/mp4',
      'x-upsert': 'false',
    },
    body: file,
  });
  if (!res.ok) { const t = await res.text().catch(()=> ''); throw new Error('Échec de l\'envoi de la vidéo (' + res.status + ') ' + t); }
  return true;
}

// Upload avec progression (XHR) — permet la barre d'avancement et l'envoi en arrière-plan
function uploadToSignedUrlProgress(path, token, file, onPct) {
  const url = `${SUPABASE_URL}/storage/v1/object/upload/sign/athlete-videos/${path}?token=${token}`;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', url, true);
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Content-Type', file.type || 'video/mp4');
    xhr.setRequestHeader('x-upsert', 'false');
    xhr.upload.onprogress = (ev) => { if (ev.lengthComputable && onPct) onPct(ev.loaded / ev.total); };
    xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
      ? resolve(true)
      : reject(new Error("Échec de l'envoi de la vidéo (" + xhr.status + ')'));
    xhr.onerror = () => reject(new Error('network'));
    xhr.ontimeout = () => reject(new Error('network'));
    xhr.send(file);
  });
}

/* ═══ FILE D'ENVOI — l'app reste utilisable pendant l'upload ═══ */
const UPLOADS = { current: null, queue: [], done: null };

function queueVideo(job){
  UPLOADS.queue.push(job);
  renderBanners();
  pumpUploads();
}

async function pumpUploads(){
  if (UPLOADS.current || !UPLOADS.queue.length) return;
  if (NET.offline) { renderBanners(); return; }
  const idx = UPLOADS.queue.findIndex(j => !j.hold);
  if (idx < 0) { renderBanners(); return; }
  const job = UPLOADS.queue.splice(idx, 1)[0];
  UPLOADS.current = { name: job.exerciseName, pct: 0, msg: null };
  renderBanners();
  try {
    let file = job.file;
    if (file.size > 48 * 1024 * 1024) {
      UPLOADS.current.msg = 'Compression…';
      renderBanners();
      file = await compressVideoIfNeeded(file, (m) => { if (UPLOADS.current) { UPLOADS.current.msg = m; renderBanners(); } });
      UPLOADS.current.msg = null;
    }
    const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
    const { path, token } = await callApi('requestVideoUpload', { exerciseName: job.exerciseName, note: job.note, fileExt: ext });
    await uploadToSignedUrlProgress(path, token, file, (pct) => {
      if (UPLOADS.current) { UPLOADS.current.pct = pct; updateUploadBar(pct); }
    });
    UPLOADS.current = null;
    UPLOADS.done = { name: job.exerciseName, t: Date.now() };
    renderBanners();
    setTimeout(() => { UPLOADS.done = null; renderBanners(); }, 5000);
    if (document.getElementById('my-exercises-list')) loadMyExercisesList();
    if (typeof loadPlayerStreak === 'function' && document.getElementById('home-week-stats')) loadPlayerStreak();
  } catch(e) {
    UPLOADS.queue.unshift(job);
    UPLOADS.current = null;
    if (isNetworkError(e)) setOffline(true);
    renderBanners();
    setTimeout(pumpUploads, 8000);
    return;
  }
  pumpUploads();
}

function updateUploadBar(pct){
  const f = document.getElementById('upl-fill');
  const t = document.getElementById('upl-pct');
  if (!f) { renderBanners(); return; }
  f.style.width = Math.round(pct * 100) + '%';
  if (t) t.textContent = Math.round(pct * 100) + ' %';
}

function releaseHolds(){
  UPLOADS.queue.forEach(j => { j.hold = false; });
  renderBanners();
  pumpUploads();

function renderBanners(){
  const el = document.getElementById('app-banners');
  if (!el) return;
  let h = '';
  if (NET.offline) {
    const d = NET.lastSync ? new Date(NET.lastSync).toLocaleDateString(LOCALE(), { day: 'numeric', month: 'long' }) : null;
    h += `<div class="banner" style="background:var(--s3)">${ICO_OFF}
      <div style="flex:1;min-width:0"><div class="bt">Hors ligne</div>
      <div class="bs">${d ? 'Données du ' + d + ' · consultables sans réseau' : 'Reconnexion automatique dès le retour du réseau'}</div></div></div>`;
  }
  if (UPLOADS.current) {
    const pct = Math.round((UPLOADS.current.pct || 0) * 100);
    const nm = (UPLOADS.current.name || '').replace(/</g, '&lt;');
    h += `<div class="banner">${ICO_UP}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
          <div class="bt" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Envoi en cours · ${nm}</div>
          <div id="upl-pct" style="font-family:var(--font-num);font-weight:700;font-size:15px;color:var(--orange)">${UPLOADS.current.msg ? '' : pct + ' %'}</div>
        </div>
        <div class="bs">${UPLOADS.current.msg || "Continue à utiliser l'app, l'envoi se poursuit"}</div>
        <div class="upl-track"><div class="upl-fill" id="upl-fill" style="width:${pct}%"></div></div>
      </div></div>`;
  } else if (UPLOADS.queue.length) {
    const n = UPLOADS.queue.length;
    const allHeld = UPLOADS.queue.every(j => j.hold);
    h += `<div class="banner">${ICO_UP}
      <div style="flex:1;min-width:0"><div class="bt">${n} vidéo${n > 1 ? 's' : ''} en attente d'envoi</div>
      <div class="bs">${NET.offline ? 'Partira dès le retour du réseau' : (allHeld ? 'Mise de côté pour plus tard' : 'Reprise automatique en cours…')}</div></div>
      ${(allHeld && !NET.offline) ? `<button class="gbtn" style="padding:8px 12px;font-size:12px;flex-shrink:0" onclick="releaseHolds()">Envoyer</button>` : ''}</div>`;
  } else if (UPLOADS.done) {
    h += `<div class="banner">${ICO_OK}
      <div style="flex:1;min-width:0"><div class="bt">Envoyé au coach</div>
      <div class="bs">${(UPLOADS.done.name || '').replace(/</g, '&lt;')}</div></div></div>`;
  }
  el.innerHTML = h;
}

// Extraction d'images fixes depuis une vidéo (canvas) pour le premier avis IA — aucun envoi de fichier vidéo entier, juste quelques images compressées.
function seekToTime(video, t){
  return new Promise((resolve) => {
    const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

async function extractVideoFrames(url, count = 4){
  const video = document.createElement('video');
  video.crossOrigin = 'anonymous';
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  await new Promise((resolve, reject) => {
    video.addEventListener('loadedmetadata', resolve, { once: true });
    video.addEventListener('error', () => reject(new Error("Impossible de charger la vidéo pour l'analyse.")), { once: true });
    video.src = url;
  });
  const duration = video.duration;
  if (!isFinite(duration) || duration <= 0) throw new Error("Durée de vidéo invalide pour l'analyse.");
  const canvas = document.createElement('canvas');
  canvas.width = Math.min(480, video.videoWidth || 480);
  canvas.height = Math.round(canvas.width * (video.videoHeight || 360) / (video.videoWidth || 480));
  const ctx = canvas.getContext('2d');
  const ratios = [0.15, 0.4, 0.65, 0.9].slice(0, count);
  const frames = [];
  for (const r of ratios) {
    await seekToTime(video, duration * r);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    let dataUrl;
    try {
      dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    } catch (e) {
      throw new Error("Impossible d'extraire les images de la vidéo (restriction du navigateur).");
    }
    frames.push(dataUrl.split(',')[1]);
  }
  return frames;
}

// Trier les clés par longueur décroissante pour que les phrases longues et
// spécifiques soient remplacées avant les fragments génériques plus courts.
const I18N_ENTRIES = Object.entries(I18N_DICT).sort((a, b) => b[0].length - a[0].length);

function tr(str) {
  if (APP_STATE.language !== 'en' || typeof str !== 'string' || !str) return str;
  let out = str;
  for (const [fr, en] of I18N_ENTRIES) {
    if (out.indexOf(fr) !== -1) out = out.split(fr).join(en);
  }
  return out;
}

// Traduction transparente de tout innerHTML / textContent assigné pendant
// que la langue active est l'anglais — couvre l'intégralité de l'app sans
// devoir modifier chaque site d'affectation individuellement.
(function () {
  const ihDesc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(Element.prototype, 'innerHTML', {
    configurable: true,
    enumerable: true,
    get: function () { return ihDesc.get.call(this); },
    set: function (html) { ihDesc.set.call(this, tr(html)); },
  });
  const tcDesc = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
  Object.defineProperty(Node.prototype, 'textContent', {
    configurable: true,
    enumerable: true,
    get: function () { return tcDesc.get.call(this); },
    set: function (text) { tcDesc.set.call(this, tr(text)); },
  });
})();

let LOGIN_LANG = null;
function pickLoginLang(l){
  LOGIN_LANG = l;
  const fr = document.getElementById('lang-fr'), en = document.getElementById('lang-en');
  [['fr',fr],['en',en]].forEach(([k,btn])=>{
    if(!btn) return;
    const on = k===l;
    btn.style.background = on ? 'var(--gold)' : 'var(--s3)';
    btn.style.color = on ? '#0a0a0a' : 'var(--w2)';
    btn.style.fontWeight = on ? '600' : '400';
  });
}
function codeBoxes(){ return Array.from({length:6}, (_,i)=>document.getElementById('code-box-'+i)); }
function readCode(){ return codeBoxes().map(b=>(b&&b.value||'').toUpperCase()).join(''); }
function codeBoxInput(i){
  const b = document.getElementById('code-box-'+i);
  if(!b) return;
  b.value = (b.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,1);
  b.style.borderColor = b.value ? 'var(--gold)' : 'var(--border)';
  if(b.value && i<5){ const n=document.getElementById('code-box-'+(i+1)); if(n){ n.focus(); n.select(); } }
  if(readCode().length===6) setTimeout(()=>handleAccessCode(), 120);
}
function codeBoxKey(e,i){
  if(e.key==='Enter'){ handleAccessCode(); return; }
  if(e.key==='Backspace' && !e.target.value && i>0){
    const p=document.getElementById('code-box-'+(i-1));
    if(p){ p.focus(); p.value=''; p.style.borderColor='var(--border)'; }
  }
  if(e.key==='ArrowLeft' && i>0) document.getElementById('code-box-'+(i-1))?.focus();
  if(e.key==='ArrowRight' && i<5) document.getElementById('code-box-'+(i+1))?.focus();
}
function codeBoxPaste(e){
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  codeBoxes().forEach((b,i)=>{ if(b){ b.value=t[i]||''; b.style.borderColor=b.value?'var(--gold)':'var(--border)'; } });
  if(t.length===6) setTimeout(()=>handleAccessCode(), 120);
}

let LOGIN_BUSY = false;
async function handleAccessCode(){
  if(LOGIN_BUSY) return;
  const code = readCode();
  const errEl=document.getElementById('access-error');
  const shake = () => { codeBoxes().forEach(b=>{ if(b){ b.style.animation='shake .3s'; setTimeout(()=>b.style.animation='',300); } }); };
  if(code.length!==6){
    errEl.textContent='Le code doit contenir 6 caractères.';
    shake();
    return;
  }
  LOGIN_BUSY = true;
  errEl.textContent='Vérification…';
  let profile;
  try {
    APP_STATE.code = code; // nécessaire pour que callApi() envoie ce code
    const data = await callApi('login', {});
    profile = data.profile;
  } catch (e) {
    profile = null;
  }
  if(!profile){
    APP_STATE.code = null;
    LOGIN_BUSY = false;
    errEl.textContent='Code invalide. Vérifie et réessaie.';
    shake();
    return;
  }
  errEl.textContent='';
  localStorage.setItem('bizon_access_code', code);
  if(!profile.language && LOGIN_LANG){
    profile.language = LOGIN_LANG;
    try{ APP_STATE.code = code; await callApi('setLanguage', { language: LOGIN_LANG }); }catch(e){}
  }
  LOGIN_BUSY = false;
  await enterApp(profile);
}

function weekKey(d){ const t=new Date(d); const day=(t.getDay()+6)%7; t.setDate(t.getDate()-day); t.setHours(0,0,0,0); return t.getTime(); }
async function loadPlayerStreak(){
  const railEl = document.getElementById('rail-streak');
  try{
    const [sh, im, subs] = await Promise.all([
      callApi('listShootingSessions', {}).catch(()=>({sessions:[]})),
      callApi('listIronmanSessions', {}).catch(()=>({sessions:[]})),
      callApi('listMySubmissions', {}).catch(()=>({submissions:[]})),
    ]);
    const dates = []
      .concat((sh.sessions||[]).map(s=>s.created_at||s.started_at))
      .concat((im.sessions||[]).map(s=>s.created_at||s.started_at))
      .filter(Boolean);
    const dayKey = d => { const t=new Date(d); t.setHours(0,0,0,0); return t.getTime(); };
    const activeDays = new Set(dates.map(dayKey));
    const weeks = new Set(dates.map(d=>weekKey(d)));
    // série : nombre de semaines consécutives actives en remontant depuis cette semaine (ou la précédente)
    let weekStreak = 0;
    let curW = weekKey(new Date());
    if(!weeks.has(curW)) curW -= 7*86400000;
    while(weeks.has(curW)){ weekStreak++; curW -= 7*86400000; }
    // série = séances sur jours consécutifs (en remontant depuis aujourd'hui ou hier)
    let streak = 0;
    let curD = new Date(); curD.setHours(0,0,0,0);
    let cd = curD.getTime();
    if(!activeDays.has(cd)) cd -= 86400000;
    while(activeDays.has(cd)){ streak++; cd -= 86400000; }
    const thisWeek = weekKey(new Date());
    const doneThisWeek = dates.filter(d=>weekKey(d)===thisWeek).length;
    const vidsThisWeek = (subs.submissions||[]).filter(s=>weekKey(s.created_at)===thisWeek).length;
    window.__STREAK = { streak, weekStreak, doneThisWeek, vidsThisWeek };
    const ru = document.getElementById('rail-user');
    if(ru && APP_STATE.role!=='coach'){
      const nm = APP_STATE.user?.name || '';
      const ini = (nm.split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('')||'?').toUpperCase();
      const sub = [APP_STATE.user?.position, APP_STATE.user?.level].filter(Boolean).join(' · ');
      ru.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:12px 4px 0">
        <div class="avatar" style="width:34px;height:34px;font-size:12px">${ini}</div>
        <div style="min-width:0"><div style="font-size:13px;font-weight:500;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nm}</div><div style="font-size:11px;color:var(--w3)">${sub}</div></div>
      </div>`;
    }
    if(railEl){
      const dots = Array.from({length:5}, (_,i)=>`<div style="flex:1;height:8px;border-radius:4px;background:${i<Math.min(streak,5)?'var(--orange)':'var(--s3)'}"></div>`).join('');
      railEl.innerHTML = `<div class="card" style="margin:0;padding:14px">
        <div style="font-size:10px;color:var(--w3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px">Série</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px">
          <div style="font-family:var(--font-num);font-weight:800;font-size:28px;color:var(--w);line-height:1">${streak}</div>
          <div style="font-size:12px;color:var(--w3)">séance${streak>1?'s':''} d'affilée</div>
        </div>
        <div style="display:flex;gap:4px">${dots}</div>
      </div>`;
    }
    const tb = document.getElementById('topbar-streak');

/* ═══ ÉVALUATION TECHNIQUE — LANCER FRANC (import Google Sheets publié en CSV) ═══ */
// Le lien Sheet est lu depuis profiles.sheet_lf pour chaque joueur.

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* ignoré */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseLancerFrancGrid(rows) {
  const dataRows = rows.slice(5);
  let currentEtape = '';
  const criteres = [];
  for (const r of dataRows) {
    const etapeCell = (r[0] || '').trim();
    const critereCell = (r[1] || '').trim();
    if (!critereCell) continue;
    if (etapeCell) currentEtape = etapeCell;
    const avant = parseFloat(r[2]);
    const commentAvant = (r[3] || '').trim();
    const apres = parseFloat(r[5]);
    const commentApres = (r[6] || '').trim();
    criteres.push({
      etape: currentEtape, critere: critereCell,
      avant: isNaN(avant) ? null : avant, commentAvant,
      apres: isNaN(apres) ? null : apres, commentApres,
    });
  }

  const groupes = {};
  criteres.forEach(c => {
    if (!groupes[c.etape]) groupes[c.etape] = { avant: [], apres: [] };
    if (c.avant !== null) groupes[c.etape].avant.push(c.avant);
    if (c.apres !== null) groupes[c.etape].apres.push(c.apres);
  });
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

  const etapes = Object.keys(groupes).map(etape => ({
    etape,
    moyenneAvant: avg(groupes[etape].avant),
    moyenneApres: avg(groupes[etape].apres),
  }));

  return { criteres, etapes };
}

function radarSVGDual(etapes) {
  const cx = 240, cy = 240, n = etapes.length, maxR = 100;
  if (!n) return '';
  const tierColor = v => v >= 4 ? '#7BC47A' : v >= 2.5 ? '#E7C34B' : '#E07070';
  const angle = i => (Math.PI * 2 / n) * i - Math.PI / 2;
  const ptAt = (r, i) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  let grid = '';
  for (let ring = 1; ring <= 4; ring++) {
    let pts = '';
    for (let i = 0; i < n; i++) { const [x, y] = ptAt(maxR * ring / 4, i); pts += x + ',' + y + ' '; }
    grid += '<polygon points="' + pts + '" fill="none" stroke="rgba(255,255,255,0.06)"/>';
  }
  let spokes = '';
  for (let i = 0; i < n; i++) { const [x, y] = ptAt(maxR, i); spokes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="rgba(255,255,255,0.05)"/>'; }
  const avgApres = etapes.reduce((a, e) => a + (e.moyenneApres || 0), 0) / n;
  const avgAvant = etapes.reduce((a, e) => a + (e.moyenneAvant || 0), 0) / n;
  let avantPts = '', apresPts = '';
  etapes.forEach((e, i) => {
    const [ax, ay] = ptAt(maxR * Math.min(1, (e.moyenneAvant || 0) / 5), i); avantPts += ax + ',' + ay + ' ';
    const [px, py] = ptAt(maxR * Math.min(1, (e.moyenneApres || 0) / 5), i); apresPts += px + ',' + py + ' ';
  });
  let dots = '';
  etapes.forEach((e, i) => {
    const [ax, ay] = ptAt(maxR * Math.min(1, (e.moyenneAvant || 0) / 5), i);
    const [px, py] = ptAt(maxR * Math.min(1, (e.moyenneApres || 0) / 5), i);
    dots += '<circle cx="' + ax + '" cy="' + ay + '" r="3" fill="#8c8c84"/>';
    dots += '<circle cx="' + px + '" cy="' + py + '" r="4" fill="' + tierColor(e.moyenneApres || 0) + '"><title>' + e.etape + ' — Avant ' + (e.moyenneAvant || 0).toFixed(1) + ' → Après ' + (e.moyenneApres || 0).toFixed(1) + '</title></circle>';
  });
  let labels = '';
  etapes.forEach((e, i) => {
    const ang = angle(i), deg = ang * 180 / Math.PI, flip = deg > 90 || deg < -90;
    const stagger = (i % 2) * 14, labelR = maxR + 18 + stagger;
    const lx = cx + labelR * Math.cos(ang), ly = cy + labelR * Math.sin(ang);
    const labelDeg = flip ? deg + 180 : deg, anchor = flip ? 'end' : 'start';
    const fs = e.etape.length > 24 ? 6.8 : e.etape.length > 17 ? 7.6 : 8.5;
    labels += '<text x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '" dominant-baseline="middle" fill="#a8a8a0" font-size="' + fs + '" font-family="Inter" letter-spacing="0.2" transform="rotate(' + labelDeg + ' ' + lx + ' ' + ly + ')">' + e.etape + '</text>';
  });
  const delta = avgApres - avgAvant, deltaTxt = (delta >= 0 ? '+' : '') + delta.toFixed(1);
  const deltaColor = delta > 0 ? '#7BC47A' : delta < 0 ? '#E07070' : '#8c8c84';
  return '<div style="text-align:center;width:100%">' +
    '<div style="font-size:10px;color:#8c8c84;letter-spacing:1.5px;margin-bottom:2px">MOYENNE APRÈS</div>' +

    '<div style="font-size:11px;font-weight:600;color:' + deltaColor + ';margin-bottom:6px">' + deltaTxt + ' vs avant (' + avgAvant.toFixed(1) + ')</div>' +
    '<svg width="480" height="480" viewBox="0 0 480 480" style="width:100%;max-width:480px;height:auto;display:block;margin:0 auto">' + grid + spokes +
    '<polygon points="' + avantPts + '" fill="#8c8c84" fill-opacity="0.08" stroke="#8c8c84" stroke-width="1.5" stroke-dasharray="4,3"/>' +
    '<polygon points="' + apresPts + '" fill="' + tierColor(avgApres) + '" fill-opacity="0.12" stroke="' + tierColor(avgApres) + '" stroke-width="2"/>' +
    dots + labels + '</svg></div>';
}
function priorityBlockHTML(etapes){
  const scored = (etapes||[]).filter(e => (e.moyenneApres||0) > 0);
  if(!scored.length) return '';
  const sorted = scored.slice().sort((a,b)=>(a.moyenneApres||0)-(b.moyenneApres||0));
  const todo = sorted.filter(e => (e.moyenneApres||0) < 3.5);
  const done = sorted.filter(e => (e.moyenneApres||0) >= 3.5);
  const row = e => {
    const d = (e.moyenneApres||0) - (e.moyenneAvant||0);
    const dTxt = Math.abs(d) < 0.05 ? '' : (d>0?'+':'') + d.toFixed(1);
    return barRow(e.etape.replace(/</g,'&lt;') + (dTxt?` <span style="color:${d>0?'var(--green)':'var(--red)'};font-size:11px">${dTxt}</span>`:''), e.moyenneApres||0, 5);
  };
  return `
  <div class="card" style="margin:0 0 12px">
    ${todo.length?`<div style="font-size:10px;color:var(--red);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px">À travailler en priorité</div>${todo.map(row).join('')}`:''}
    ${done.length?`<div style="font-size:10px;color:var(--green);text-transform:uppercase;letter-spacing:1.2px;margin:${todo.length?'16px':'0'} 0 10px">Acquis</div>${done.map(row).join('')}`:''}
  </div>`;
}

/* ═══ ÉVALUATION TECHNIQUE — 2PTS / 3PTS (format checklist TRUE/FALSE) ═══ */
// Les liens Sheet sont lus depuis profiles.sheet_2pts / sheet_3pts.

const CHECKLIST_LABELS = {
  '3pts': '3 points après drive',
  '2pts': '2 points',
  'diagnostic': 'Diagnostic général',
};

function parseChecklistGrid(rows) {
  let headerIdx = rows.findIndex(r => (r[0] || '').trim() === 'Étape' && (r[1] || '').trim().toLowerCase().includes('critère'));
  if (headerIdx === -1) headerIdx = 7;
  const dataRows = rows.slice(headerIdx + 1);

  let currentEtape = '';
  const criteres = [];
  for (const r of dataRows) {
    const etapeCell = (r[0] || '').trim();
    if (etapeCell.toUpperCase().includes('PRIORITÉS DE TRAVAIL')) break;
    const critereCell = (r[1] || '').trim();
    if (!critereCell) continue;
    if (etapeCell) currentEtape = etapeCell;
    let score = null;
    for (let s = 1; s <= 5; s++) {
      const cell = (r[1 + s] || '').trim().toUpperCase();
      if (cell === 'TRUE') { score = s; break; }
    }
    criteres.push({ etape: currentEtape, critere: critereCell, score });
  }

  const groupes = {};
  criteres.forEach(c => {
    if (!groupes[c.etape]) groupes[c.etape] = [];
    if (c.score !== null) groupes[c.etape].push(c.score);
  });
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const etapes = Object.keys(groupes).map(etape => ({ etape, moyenne: avg(groupes[etape]) }));

  return { criteres, etapes };
}

function radarSVGSingle(etapes) {
  const cx = 240, cy = 240, n = etapes.length, maxR = 100;
  if (!n) return '';
  const tierColor = v => v >= 4 ? '#7BC47A' : v >= 2.5 ? '#E7C34B' : '#E07070';
  const angle = i => (Math.PI * 2 / n) * i - Math.PI / 2;
  const ptAt = (r, i) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  let grid = '';
  for (let ring = 1; ring <= 4; ring++) {
    let pts = '';
    for (let i = 0; i < n; i++) { const [x, y] = ptAt(maxR * ring / 4, i); pts += x + ',' + y + ' '; }
    grid += '<polygon points="' + pts + '" fill="none" stroke="rgba(255,255,255,0.06)"/>';
  }
  let spokes = '';
  for (let i = 0; i < n; i++) { const [x, y] = ptAt(maxR, i); spokes += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="rgba(255,255,255,0.05)"/>'; }
  const avg = etapes.reduce((a, e) => a + (e.moyenne || 0), 0) / n;
  let pts2 = '';
  etapes.forEach((e, i) => { const [x, y] = ptAt(maxR * Math.min(1, (e.moyenne || 0) / 5), i); pts2 += x + ',' + y + ' '; });
  let dots = '';
  etapes.forEach((e, i) => {
    const [x, y] = ptAt(maxR * Math.min(1, (e.moyenne || 0) / 5), i);
    dots += '<circle cx="' + x + '" cy="' + y + '" r="4" fill="' + tierColor(e.moyenne || 0) + '"><title>' + e.etape + ' — ' + (e.moyenne || 0).toFixed(1) + '</title></circle>';
  });
  let labels = '';
  etapes.forEach((e, i) => {
    const ang = angle(i), deg = ang * 180 / Math.PI, flip = deg > 90 || deg < -90;
    const stagger = (i % 2) * 14, labelR = maxR + 18 + stagger;
    const lx = cx + labelR * Math.cos(ang), ly = cy + labelR * Math.sin(ang);
    const labelDeg = flip ? deg + 180 : deg, anchor = flip ? 'end' : 'start';
    const fs = e.etape.length > 24 ? 6.8 : e.etape.length > 17 ? 7.6 : 8.5;
    labels += '<text x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '" dominant-baseline="middle" fill="#a8a8a0" font-size="' + fs + '" font-family="Inter" letter-spacing="0.2" transform="rotate(' + labelDeg + ' ' + lx + ' ' + ly + ')">' + e.etape + '</text>';
  });
  return '<div style="text-align:center;width:100%">' +
    '<div style="font-size:10px;color:#8c8c84;letter-spacing:1.5px;margin-bottom:2px">MOYENNE</div>' +
    '<div style="font-size:24px;font-weight:700;color:' + tierColor(avg) + ';margin-bottom:6px">' + avg.toFixed(1) + '<span style="font-size:12px;color:#8c8c84;font-weight:400"> / 5</span></div>' +
    '<svg width="480" height="480" viewBox="0 0 480 480" style="width:100%;max-width:480px;height:auto;display:block;margin:0 auto">' + grid + spokes +
    '<polygon points="' + pts2 + '" fill="' + tierColor(avg) + '" fill-opacity="0.12" stroke="' + tierColor(avg) + '" stroke-width="2"/>' +
    dots + labels + '</svg></div>';
}
function renderChecklistEval(etapes) {
  if (!etapes.length) return `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucune donnée trouvée dans le Sheet.</div></div>`;
  return `
  <div class="app-grid-2" style="padding:0">
    <div>
      <div class="card" style="display:flex;justify-content:center;margin:0">${radarSVGSingle(etapes)}</div>
      <div style="display:flex;gap:10px;padding:10px 0 0;font-size:10px;color:var(--w3);flex-wrap:wrap;justify-content:center">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#7BC47A;margin-right:5px"></span>≥4</span>

        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#E07070;margin-right:5px"></span><2.5</span>
      </div>
    </div>
    <div>
      <div class="sec" style="padding-left:0;padding-top:0">Détail par étape</div>
      <div class="card" style="margin:0">
        ${etapes.map(e => `
        <div class="sb-row">
          <div class="sb-lbl" style="width:170px">${e.etape}</div>
          <div class="sb-bg"><div class="sb-fill" style="width:${(e.moyenne / 5) * 100}%;background:${e.moyenne>=4?'#7BC47A':e.moyenne>=2.5?'#E7C34B':'#E07070'}"></div></div>
          <div class="sb-val">${e.moyenne.toFixed(1)}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>
  <div style="height:24px"></div>`;

    if(!notes || !notes.length){

async function submitCoachNote(){
  const ta = document.getElementById('new-coach-note');
  const note = (ta.value||'').trim();
  if(!note) return;
  const playerId = CURRENT.playerDetailId;
  try{
    await callApi('addCoachNote', { playerId, note });
    ta.value='';
    await loadCoachNotes(playerId);
  }catch(e){ alert(tr(e.message)); }
}

async function removeCoachNote(noteId, playerId){
  if(!confirm(tr('Supprimer ce diagnostic ?'))) return;
  try{
    await callApi('deleteCoachNote', { noteId });
    await loadCoachNotes(playerId);
  }catch(e){ alert(tr(e.message)); }
}

function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil((((t - y0) / 86400000) + 1) / 7);

async function drawMyCard(name, role){
  const cv = document.getElementById('card-canvas');
  if(!cv) return;
  const W = 1080, H = 1350;
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  // fond
  x.fillStyle = '#0B0B0A'; x.fillRect(0,0,W,H);
  // terrain en filigrane
  x.strokeStyle = 'rgba(201,162,39,0.16)'; x.lineWidth = 3;
  x.strokeRect(70, 150, W-140, H-320);
  x.beginPath(); x.arc(W/2, 150, 150, 0, Math.PI); x.stroke();
  x.beginPath(); x.arc(W/2, H-170, 150, Math.PI, 2*Math.PI); x.stroke();
  x.beginPath(); x.arc(W/2, H/2, 110, 0, 2*Math.PI); x.stroke();
  // logo texte
  try{
    const logo = new Image();
    logo.src = LOGO_MARK;
    await new Promise((res)=>{ logo.onload=res; logo.onerror=res; setTimeout(res,1200); });
    if(logo.width) x.drawImage(logo, 76, 34, 46, Math.round(46*logo.height/logo.width));
  }catch(e){}
  x.fillStyle = '#FAF9F6';
  x.font = '600 46px "Bebas Neue", Impact, sans-serif';
  x.letterSpacing = '7px';
  x.fillText('BIZON TRAINING', 142, 96);
  x.letterSpacing = '0px';
  // score
  let score = null, delta = null, critLabel = 'Lancer franc';
  try{
    const { sheets } = await callApi('getSheetLinks', { playerId: APP_STATE.userId });
    if(sheets?.sheet_lf){
      const res = await fetch(sheets.sheet_lf);
      const { etapes } = parseLancerFrancGrid(parseCSV(await res.text()));
      const sc = etapes.filter(e => (e.moyenneApres||0) > 0);
      if(sc.length){
        score = sc.reduce((a,e)=>a+(e.moyenneApres||0),0)/sc.length;
        const av = sc.reduce((a,e)=>a+(e.moyenneAvant||0),0)/sc.length;
        delta = score - av;
      }
    }
  }catch(e){}
  x.letterSpacing = '2px';
  x.fillStyle = '#E7C34B';
  x.font = '500 34px "JetBrains Mono", monospace';
  x.fillText(critLabel.toUpperCase(), 80, H/2 - 150);
  x.letterSpacing = '0px';
  x.fillStyle = '#FAF9F6';
  x.font = '800 230px "Big Shoulders Display", Impact, sans-serif';
  x.fillText(score != null ? score.toFixed(1) : '—', 76, H/2 + 40);
  if(score != null){
    const w = x.measureText(score.toFixed(1)).width;
    x.font = '500 46px Inter, sans-serif';
    x.fillStyle = '#8c8c84';
    x.fillText('/ 5', 96 + w, H/2 + 40);
    if(delta != null && Math.abs(delta) >= 0.05){
      x.font = '700 48px Inter, sans-serif';
      x.fillStyle = delta > 0 ? '#7BC47A' : '#E07070';
      x.fillText((delta>0?'+':'') + delta.toFixed(1), 96 + w, H/2 - 60);
    }
  }
  // nom
  x.fillStyle = '#FAF9F6';
  x.font = '600 78px "Bebas Neue", Impact, sans-serif';
  x.letterSpacing = '3px';
  x.fillText((name||'').toUpperCase(), 80, H/2 + 160);
  x.letterSpacing = '0px';
  x.fillStyle = '#c2c0b8';
  x.font = '400 36px Inter, sans-serif';
  x.fillText(role, 80, H/2 + 215);
  // pied
  x.strokeStyle = 'rgba(255,255,255,0.12)'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(80, H-190); x.lineTo(W-80, H-190); x.stroke();
  x.fillStyle = '#8c8c84';
  x.font = '400 34px "JetBrains Mono", monospace';
  x.fillText('bizontraining.fr', 80, H-130);
  ['#E7C34B','#F08A5A','#7BC47A'].forEach((col,i)=>{ x.fillStyle=col; x.beginPath(); x.arc(W-190+i*50, H-142, 13, 0, 2*Math.PI); x.fill(); });
}

let __ffmpegInstance = null;
async function loadScriptOnce(src){
  if(document.querySelector('script[src="'+src+'"]')) return;
  await new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('Impossible de charger '+src));
    document.head.appendChild(s);
  });
}
async function getFFmpeg(){
  if(__ffmpegInstance) return __ffmpegInstance;
  await loadScriptOnce('ffmpeg-vendor/ffmpeg.js');
  await loadScriptOnce('https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js');
  const { FFmpeg } = window.FFmpegWASM;
  const { toBlobURL } = window.FFmpegUtil;
  const ffmpeg = new FFmpeg();
  const base = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  await ffmpeg.load({
    coreURL: await toBlobURL(base+'/ffmpeg-core.js', 'text/javascript'),
    wasmURL: await toBlobURL(base+'/ffmpeg-core.wasm', 'application/wasm'),
  });
  __ffmpegInstance = ffmpeg;
  return ffmpeg;
}

function getVideoDuration(file){
  return new Promise((resolve)=>{
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = ()=>{ URL.revokeObjectURL(v.src); resolve(v.duration||30); };
    v.onerror = ()=> resolve(30);
    v.src = URL.createObjectURL(file);
  });
}

async function compressVideoIfNeeded(file, onProgress){
  const SAFE_LIMIT = 48*1024*1024;
  const SANITY_CAP = 500*1024*1024;
  if(file.size <= SAFE_LIMIT) return file;
  if(file.size > SANITY_CAP) throw new Error('Vidéo beaucoup trop volumineuse (max 500 Mo).');
  onProgress && onProgress('Préparation de la compression…');
  const ffmpeg = await getFFmpeg();
  const duration = await getVideoDuration(file);
  const targetBytes = 40*1024*1024;
  let videoKbps = Math.floor((targetBytes*8)/duration/1000*0.9);
  videoKbps = Math.max(300, Math.min(2500, videoKbps));
  const { fetchFile } = window.FFmpegUtil;
  const inName = 'input.'+(file.name.split('.').pop()||'mp4');
  await ffmpeg.writeFile(inName, await fetchFile(file));
  const onProg = ({progress})=>{ onProgress && onProgress('Compression… '+Math.round(Math.min(1,progress)*100)+'%'); };
  ffmpeg.on('progress', onProg);
  try{
    await ffmpeg.exec(['-i', inName, '-vf', "scale='min(1280,iw)':-2", '-c:v','libx264','-preset','veryfast','-b:v', videoKbps+'k', '-maxrate', Math.round(videoKbps*1.2)+'k', '-bufsize', Math.round(videoKbps*2)+'k', '-c:a','aac','-b:a','96k','-movflags','+faststart','output.mp4']);
  } finally {
    ffmpeg.off('progress', onProg);
  }
  const data = await ffmpeg.readFile('output.mp4');
  await ffmpeg.deleteFile(inName).catch(()=>{});
  await ffmpeg.deleteFile('output.mp4').catch(()=>{});
  const blob = new Blob([data.buffer], { type: 'video/mp4' });
  const newName = file.name.replace(/\.[^.]+$/, '') + '_compressed.mp4';
  return new File([blob], newName, { type: 'video/mp4' });
}

function fmtDur(s){
  if(!isFinite(s) || s <= 0) return '';
  const m = Math.floor(s/60), r = Math.round(s%60);
  return m + ':' + String(r).padStart(2,'0');
}

function sendReview(later){

  const errEl = document.getElementById('rev-error');

}

function relativeDaysFR(dateStr){
  if(!dateStr) return null;
  const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  if(APP_STATE.language==='en'){
    if(days<=0) return 'today';
    if(days===1) return 'yesterday';
    return `${days}d ago`;
  }
  if(days<=0) return "aujourd'hui";
  if(days===1) return "hier";
  return `il y a ${days} j`;
}

async function loadCoachPlayers() {
  const el = document.getElementById('coach-players-list');
  const statsEl = document.getElementById('coach-stats');
  if (!el) return;
  if (!APP_STATE.userId) {
    el.innerHTML = `<div class="card" style="margin:0"><div style="font-size:12px;color:var(--w3)">Connecte-toi avec ton code coach pour voir tes joueurs.</div></div>`;
    if (statsEl) statsEl.innerHTML = '';
    return;
  }
  try {
    const { players: rawPlayers } = await callApi('listPlayers', {});
    const players = (rawPlayers || []).slice().sort((a, b) => {
      const da = a.last_note_at ? (Date.now() - new Date(a.last_note_at).getTime()) : Infinity;
      const db = b.last_note_at ? (Date.now() - new Date(b.last_note_at).getTime()) : Infinity;
      return db - da;
    });

    if (!players || !players.length) {
      el.innerHTML = `<div class="card" style="margin:0"><div style="font-size:12px;color:var(--w3)">Aucun joueur rattaché pour l'instant. Ajoute ton premier joueur ci-dessous.</div></div>`;
      if (statsEl) statsEl.innerHTML = '';
      return;
    }

    const STALE_DAYS = 14;
    const now = Date.now();
    const missingSheets = players.filter(p => !p.sheets_configured).length;
    const staleOrNever = players.filter(p => {
      if (!p.last_note_at) return true;
      return (now - new Date(p.last_note_at).getTime()) / 86400000 > STALE_DAYS;
    }).length;
    let pendingVideos = 0;
    try { const s = await callApi('getCoachSubmissionsSummary', {}); pendingVideos = s.pendingCount || 0; } catch(e) {}

    if (statsEl) {
      const stat = (val, lbl, col) => `<div class="card" style="margin:0;padding:16px 12px">
        <div style="font-family:var(--font-num);font-weight:800;font-size:32px;color:${col};line-height:1">${val}</div>
        <div style="font-size:11.5px;color:var(--w3);margin-top:5px">${lbl}</div></div>`;
      statsEl.innerHTML =
        stat(players.length, 'joueur' + (players.length>1?'s':''), 'var(--w)') +
        stat(pendingVideos, 'vidéo' + (pendingVideos>1?'s':'') + ' à voir', pendingVideos ? 'var(--orange)' : 'var(--w)') +
        stat(staleOrNever, 'sans suivi', staleOrNever ? 'var(--red)' : 'var(--w)');
    }

    // vidéos en attente par joueur (si l'API le permet) — sert aux pastilles orange
    let pendingByPlayer = {};
    try {
      const r = await callApi('listCoachSubmissions', {});
      (r.submissions || []).forEach(s => {
        if (s.status !== 'reviewed' && s.player_id) pendingByPlayer[s.player_id] = (pendingByPlayer[s.player_id] || 0) + 1;
      });
    } catch(e) { /* action limitée à un joueur : pas de pastille */ }

    el.innerHTML = players.map(p => {
      const initials = ((p.first_name || '?')[0] + (p.last_name || '?')[0]).toUpperCase();
      const name = `${p.first_name || ''} ${p.last_name || ''}`.trim();
      const role = [p.position, p.level].filter(Boolean).join(' · ') || 'Joueur';
      const noteDays = p.last_note_at ? (now - new Date(p.last_note_at).getTime()) / 86400000 : Infinity;
      const pend = pendingByPlayer[p.id] || 0;
      const stale = noteDays > STALE_DAYS;
      const badge = pend
        ? `<span style="flex-shrink:0;background:var(--orange-bg);color:var(--orange);border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600">${pend} vidéo${pend>1?'s':''}</span>`
        : (stale ? `<span style="flex-shrink:0;background:var(--gold2);color:#0a0a0a;border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:600">Relancer</span>` : '');
      const sub = [role, p.last_note_at ? 'suivi ' + relativeDaysFR(p.last_note_at) : 'sans suivi'].join(' · ');
      return `
      <div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer;margin:0" onclick="openPlayerDetail('${p.id}','${name.replace(/'/g, "\\'")}')">
        <div class="avatar" style="width:44px;height:44px;font-size:13px">${initials}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:500;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
          <div style="font-size:12px;color:var(--w3);margin-top:2px">${sub}</div>
          ${!p.sheets_configured ? `<div style="margin-top:6px"><span class="tag r" style="font-size:10px">Sheets à configurer</span></div>` : ''}
        </div>
        ${badge}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--w3)" stroke-width="1.5" style="flex-shrink:0"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Erreur chargement joueurs:', e);
    el.innerHTML = `<div class="card" style="margin:0"><div style="font-size:12px;color:var(--red)">Impossible de charger la liste des joueurs.</div></div>`;
    if (statsEl) statsEl.innerHTML = '';
  }
}

async function closeObjectiveUI(objectiveId, status, playerId, playerName){
  const v = prompt(tr(status==='achieved' ? 'Valeur atteinte (ex: 3.6) — optionnel' : 'Valeur finale (ex: 3.2) — optionnel'));
  if(v === null) return;
  const num = parseFloat(String(v).replace(',','.'));
  try{
    await callApi('closeObjective', { objectiveId, status, final_value: isNaN(num) ? null : num });
    await loadCoachObjectiveBox(playerId, playerName);
  }catch(e){ alert(tr(e.message)); }
}

let OBJ_CTX = null;
async function openSetObjective(playerId, playerName){
  const first = (playerName||'').split(' ')[0];
  const weekOf = new Date().toLocaleDateString(LOCALE(), { day:'2-digit', month:'long' });
  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;padding:14px 0 6px">
      <button onclick="openPlayerDetail('${playerId}','${(playerName||'').replace(/'/g,"\\'")}')" style="width:44px;height:44px;border-radius:50%;background:var(--s2);border:.5px solid var(--border);color:var(--gold);font-size:22px;cursor:pointer;line-height:1;flex-shrink:0">‹</button>
      <div>
        <div style="font-size:18px;font-weight:600;color:var(--w)">Objectif de ${first}</div>
        <div style="font-size:12px;color:var(--w3)">Semaine du ${weekOf}</div>
      </div>
    </div>
    <div class="sec" style="padding-left:0;padding-top:18px">Critère le plus faible</div>
    <div id="obj-criteria"><div class="card"><span class="skel-bar"></span></div></div>
    <div class="sec" style="padding-left:0;padding-top:18px">Cible à atteindre</div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between">
      <button class="ghost" style="width:46px;height:46px;border-radius:50%;font-size:20px;padding:0" onclick="objStep(-0.5)">−</button>
      <div style="text-align:center"><div id="obj-target" style="font-family:var(--font-num);font-weight:800;font-size:34px;color:var(--w);line-height:1">3.5</div><div style="font-size:11px;color:var(--w3)">sur 5</div></div>
      <button class="ghost" style="width:46px;height:46px;border-radius:50%;font-size:20px;padding:0;background:var(--gold4);color:var(--gold2)" onclick="objStep(0.5)">+</button>
    </div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold2)" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <div><div style="font-size:14px;color:var(--w)"><span id="obj-sessions">2</span> séances de tir</div><div style="font-size:11px;color:var(--w3)">prévues cette semaine</div></div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="ghost" style="width:34px;height:34px;border-radius:50%;padding:0" onclick="objSessions(-1)">−</button>
        <button class="ghost" style="width:34px;height:34px;border-radius:50%;padding:0" onclick="objSessions(1)">+</button>
      </div>
    </div>
    <div class="card"><textarea class="finput" id="obj-note" rows="2" placeholder="Consigne pour ${first} (optionnel)" style="margin:0;resize:vertical"></textarea></div>
    <div id="obj-history" class="card" style="display:none"></div>
    <button class="gbtn full" style="margin-top:14px;padding:14px" onclick="submitObjective()">Envoyer l'objectif à ${first}</button>
    <div style="height:24px"></div>`;
  OBJ_CTX = { playerId, playerName, criteria: [], selected: null, target: 3.5, sessions: 2 };
  // Historique
  try{
    const { history } = await callApi('getObjectives', { playerId });
    const h = document.getElementById('obj-history');
    if(h && history && history.length){ h.style.display='block'; h.innerHTML = objectiveHistoryHTML(history).replace('margin:14px 0 6px','margin:0 0 6px'); }
  }catch(e){}
  // Critères depuis le Sheet Lancer franc
  const box = document.getElementById('obj-criteria');
  try{
    const { sheets } = await callApi('getSheetLinks', { playerId });
    let etapes = [];
    if(sheets?.sheet_lf){
      const res = await fetch(sheets.sheet_lf);
      const text = await res.text();
      etapes = parseLancerFrancGrid(parseCSV(text)).etapes;
    }
    if(!etapes.length){
      OBJ_CTX.criteria = [];
      box.innerHTML = `<div class="card"><input class="finput" id="obj-free-crit" placeholder="Critère à travailler (ex: Relâché du poignet)" style="margin:0"/><div style="font-size:11px;color:var(--w3);margin-top:6px">Aucune évaluation Lancer franc trouvée : saisis le critère librement.</div></div>`;
      return;
    }
    const scored = etapes.filter(e => (e.moyenneApres||0) > 0);
    const sorted = (scored.length ? scored : etapes).slice().sort((a,b)=>(a.moyenneApres||0)-(b.moyenneApres||0));
    OBJ_CTX.criteria = sorted;
    objSelect(0);
  }catch(e){
    box.innerHTML = `<div class="card"><input class="finput" id="obj-free-crit" placeholder="Critère à travailler" style="margin:0"/></div>`;
  }
}
function objSelect(i){
  OBJ_CTX.selected = i;
  const crit = OBJ_CTX.criteria[i];
  const cur = crit.moyenneApres || 0;
  OBJ_CTX.target = Math.min(5, Math.round((cur + 0.5) * 2) / 2);
  const t = document.getElementById('obj-target'); if(t) t.textContent = OBJ_CTX.target.toFixed(1);
  const box = document.getElementById('obj-criteria');
  box.innerHTML = OBJ_CTX.criteria.slice(0,5).map((c,idx) => {
    const on = idx === i;
    return `<div class="card" onclick="objSelect(${idx})" style="cursor:pointer;display:flex;align-items:center;gap:12px;${on?'border:1px solid var(--gold);background:var(--gold4);':''}">
      <div style="width:22px;height:22px;border-radius:50%;flex-shrink:0;border:1.5px solid ${on?'var(--gold2)':'var(--border2)'};background:${on?'var(--gold2)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:12px;color:#0a0a0a">${on?'✓':''}</div>
      <div><div style="font-size:14px;font-weight:500;color:var(--w)">${c.etape.replace(/</g,'&lt;')}</div><div style="font-size:12px;color:${on?'var(--gold2)':'var(--w3)'}">${(c.moyenneApres||0).toFixed(1)} / 5${idx===0?' · le plus bas de sa grille':''}</div></div>
    </div>`;
  }).join('');
}
function objStep(d){ OBJ_CTX.target = Math.max(0.5, Math.min(5, OBJ_CTX.target + d)); document.getElementById('obj-target').textContent = OBJ_CTX.target.toFixed(1); }
function objSessions(d){ OBJ_CTX.sessions = Math.max(0, Math.min(7, OBJ_CTX.sessions + d)); document.getElementById('obj-sessions').textContent = OBJ_CTX.sessions; }
async function submitObjective(){
  if(!OBJ_CTX) return;
  let criterion, start_value = null;
  if(OBJ_CTX.criteria.length && OBJ_CTX.selected !== null){
    const c = OBJ_CTX.criteria[OBJ_CTX.selected];
    criterion = c.etape; start_value = c.moyenneApres || null;
  } else {
    criterion = (document.getElementById('obj-free-crit')?.value || '').trim();
  }
  if(!criterion){ alert(tr('Choisis un critère.')); return; }
  const note = (document.getElementById('obj-note')?.value || '').trim();
  try{
    await callApi('setObjective', { playerId: OBJ_CTX.playerId, criterion, start_value, target_value: OBJ_CTX.target, sessions_planned: OBJ_CTX.sessions, note });
    openPlayerDetail(OBJ_CTX.playerId, OBJ_CTX.playerName);
  }catch(e){ alert(tr(e.message)); }
}

async function loadCoachExercisesList(playerId){

  try{
    const { submissions } = await callApi('listCoachSubmissions', { playerId });
    if(!submissions || !submissions.length){
      el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucune vidéo envoyée par ce joueur pour l'instant.</div></div>`;
      return;
    }
    el.innerHTML = submissions.map(s=>{
      const d = new Date(s.created_at);
      const dateStr = d.toLocaleDateString(LOCALE(), { day:'2-digit', month:'short', year:'numeric' });
      const statusTag = s.status==='reviewed' ? `<span class="tag g" style="font-size:10px">Corrigé</span>` : `<span class="tag a" style="font-size:10px">En attente</span>`;
      return `

        <div id="ai-block-${s.id}">
          ${s.ai_analysis ? `
          <div style="margin-top:10px;padding-top:10px;border-top:.5px solid var(--border)">
            <div style="font-size:10px;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Premier avis IA</div>
            <div style="font-size:12px;color:var(--w2);white-space:pre-wrap">${s.ai_analysis.replace(/</g,'&lt;')}</div>
            <button class="ghost" style="margin-top:8px;font-size:11px;padding:6px 10px" onclick="analyzeSubmission('${s.id}','${playerId}')">Relancer l'analyse</button>
          </div>` : `
          <button class="ghost full" style="margin-top:10px" onclick="analyzeSubmission('${s.id}','${playerId}')">✨ Analyser avec l'IA</button>`}
        </div>
        <textarea class="finput" id="fb-${s.id}" rows="2" placeholder="Feedback pour le joueur…" style="resize:vertical;margin-top:10px">${s.coach_feedback ? s.coach_feedback.replace(/</g,'&lt;') : ''}</textarea>
        <div style="display:flex;gap:8px">
          <button class="gbtn" style="flex:1" onclick="submitCoachFeedback('${s.id}','${playerId}')">${s.status==='reviewed' ? 'Mettre à jour' : 'Marquer comme corrigé'}</button>
          <button class="ghost" style="color:var(--red)" onclick="deleteCoachSubmission('${s.id}','${playerId}')">✕</button>

    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger les vidéos.</div></div>`;

async function deleteCoachSubmission(submissionId, playerId){

  try{

    await loadCoachExercisesList(playerId);
  }catch(e){ alert(tr(e.message)); }

async function analyzeSubmission(submissionId, playerId){
  const container = document.getElementById('ai-block-'+submissionId);
  if(container) container.innerHTML = `<div style="font-size:12px;color:var(--w3);margin-top:10px">Analyse en cours… (extraction des images puis appel IA)</div>`;
  try{
    const { url } = await callApi('getSubmissionVideoUrl', { submissionId });

    await callApi('analyzeSubmissionVideo', { submissionId, frames });
    await loadCoachExercisesList(playerId);
  }catch(e){
    if(container) container.innerHTML = `<div style="font-size:12px;color:var(--red);margin-top:10px">${e.message}</div>`;
  }
}

// Extrait l'ID de fichier depuis un lien Google Drive (formats /file/d/ID/... ou ?id=ID)
function driveFileId(url){
  if(!url) return null;
  let m = url.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  return null;
}

function videoTileHTML(v, big){
  const isCoach = APP_STATE.role === 'coach';
  const title = (v.title || '').replace(/</g, '&lt;');
  const h = big ? 200 : 118;
  const play = big ? 58 : 40;
  return `<div style="position:relative;cursor:pointer" onclick="openVideo('${v.id}')">
    <div style="position:relative;border-radius:var(--r20);overflow:hidden;height:${h}px;background:repeating-linear-gradient(45deg,var(--s3),var(--s3) 8px,var(--s2) 8px,var(--s2) 16px);display:flex;align-items:center;justify-content:center">
      <div style="width:${play}px;height:${play}px;border-radius:50%;background:var(--gold2);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.45)">
        <svg width="${Math.round(play*0.4)}" height="${Math.round(play*0.4)}" viewBox="0 0 24 24" fill="#0a0a0a"><path d="M8 5v14l11-7z"/></svg>
      </div>
      ${isCoach ? `<button class="ghost" style="position:absolute;top:8px;right:8px;padding:5px 9px;color:var(--red)" title="Supprimer" onclick="event.stopPropagation();deleteVideo('${v.id}')">✕</button>` : ''}
    </div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:${big ? 22 : 16}px;color:var(--w);letter-spacing:.8px;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
    ${v.category ? `<div style="font-size:12px;color:var(--w3);margin-top:2px">${v.category}${v.added_by_name ? ' · ajouté par ' + v.added_by_name : ''}</div>` : ''}
  </div>`;
}

async function loadVideos(){
  const el=document.getElementById('biblio-list');
  if(!el) return;
  if(NET.offline){
    el.innerHTML = `<div class="card dim" style="margin:0;display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:var(--r8);background:var(--s3);display:flex;align-items:center;justify-content:center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--w3)" stroke-width="1.6"><rect x="2" y="6" width="13" height="12" rx="3"/><path d="M15 11l6-3v8l-6-3z"/></svg>
        </div>
        <div><div style="font-size:14px;color:var(--w2)">Bibliothèque vidéo</div><div style="font-size:12px;color:var(--w3);margin-top:2px">Indisponible hors ligne</div></div>
      </div>`;
    return;
  }
  try{
    const { videos } = await callApi('listVideos', { category: BIBLIO_STATE.filter });
    BIBLIO_STATE.videos=videos||[];
    if(!videos || !videos.length){
      el.innerHTML=`<div class="card" style="margin:0"><div style="font-size:12px;color:var(--w3)">Aucune vidéo${BIBLIO_STATE.filter!=='Tous'?` dans la catégorie « ${BIBLIO_STATE.filter} »`:''} pour l'instant.${APP_STATE.role==='coach'?' Ajoute ta première vidéo avec le bouton ci-dessus.':''}</div></div>`;
      return;
    }
    const featured = videos[0];
    const rest = videos.slice(1);
    el.innerHTML = videoTileHTML(featured, true)
      + (rest.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px">${rest.map(v=>videoTileHTML(v,false)).join('')}</div>` : '');
  }catch(e){
    console.error('Erreur chargement vidéos:', e);
    el.innerHTML=`<div class="card" style="margin:0"><div style="font-size:12px;color:var(--red)">Impossible de charger les vidéos.</div><div style="font-size:11px;color:var(--w3);margin-top:6px;font-family:monospace">${(e.message||String(e)).replace(/</g,'&lt;')}</div></div>`;
  }
}

async function createVideo(){

function quizOptionLetter(i){ return String.fromCharCode(65+i); }
function quizVideoEmbed(url){
  if(!url) return '';

    return '<div style="position:relative;padding-top:56.25%;margin-bottom:10px;border-radius:var(--r12);overflow:hidden;background:#000"><iframe src="https://www.youtube.com/embed/'+yt[1]+'" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div>';
  }
  return '<video src="'+url+'" controls playsinline style="width:100%;border-radius:var(--r12);background:#000;margin-bottom:10px;max-height:280px"></video>';
}

async function submitVisionQuiz(){

}

async function loadQuizEditor(){
  const el = document.getElementById('quiz-editor-section');
  if(!el) return;
  try{
    const { questions } = await callApi('getQuizQuestions', {});

function renderQuizEditor(){
  const el = document.getElementById('quiz-editor-section');
  if(!el) return;
  const qs = QUIZ_EDIT_STATE.questions;
  el.innerHTML = `
    <div style="font-size:11px;color:var(--w3);line-height:1.5;margin:0 0 12px">Rédige les questions du QCM "Vision de jeu". Sélectionne la bonne réponse pour chaque question.</div>
    ${qs.map((q,qi) => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.6px">Question ${qi+1}</div>
        <button class="ghost" style="color:var(--red);font-size:11px;padding:4px 8px" onclick="quizEditorRemoveQuestion(${qi})">Supprimer</button>
      </div>
      <textarea class="finput" rows="2" style="resize:vertical" placeholder="Énoncé de la question" oninput="quizEditorUpdateField(${qi},'question',this.value)">${(q.question||'').replace(/</g,'&lt;')}</textarea>
      <input class="finput" style="margin:8px 0" placeholder="Lien vidéo (YouTube ou mp4) — optionnel" value="${(q.video_url||'').replace(/"/g,'&quot;')}" oninput="quizEditorUpdateField(${qi},'video_url',this.value)"/>
      <select class="finput" style="margin:0 0 10px" onchange="quizEditorUpdateField(${qi},'poste',this.value)">
        <option value="" ${!q.poste?'selected':''}>Poste indicatif — tous postes</option>
        <option value="Meneur" ${q.poste==='Meneur'?'selected':''}>Meneur</option>
        <option value="Arrière" ${q.poste==='Arrière'?'selected':''}>Arrière</option>
        <option value="Ailier" ${q.poste==='Ailier'?'selected':''}>Ailier</option>
        <option value="Ailier fort" ${q.poste==='Ailier fort'?'selected':''}>Ailier fort</option>
        <option value="Pivot" ${q.poste==='Pivot'?'selected':''}>Pivot</option>
      </select>
      ${q.options.map((opt,oi) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <input type="radio" name="correct-${qi}" ${q.correct_index===oi?'checked':''} onchange="quizEditorUpdateField(${qi},'correct_index',${oi})"/>
        <input class="finput" style="margin:0" value="${(opt||'').replace(/</g,'&lt;')}" placeholder="Option ${quizOptionLetter(oi)}" oninput="quizEditorUpdateOption(${qi},${oi},this.value)"/>
        ${q.options.length>2 ? `<button class="ghost" style="padding:4px 8px;font-size:11px" onclick="quizEditorRemoveOption(${qi},${oi})">✕</button>` : ''}
      </div>`).join('')}
      <button class="ghost" style="font-size:11px;padding:6px 10px" onclick="quizEditorAddOption(${qi})">+ Option</button>
    </div>`).join('')}
    <button class="ghost full" onclick="quizEditorAddQuestion()">+ Ajouter une question</button>
    <div id="quiz-editor-msg" style="font-size:12px;color:var(--green);margin:10px 0 6px"></div>
    <button class="gbtn full" onclick="saveQuizEditor()">Enregistrer le questionnaire</button>
    <div style="height:24px"></div>
  `;
}

function quizEditorAddQuestion(){
  QUIZ_EDIT_STATE.questions.push({ question:'', options:['',''], correct_index:0, video_url:'', poste:'' });
  renderQuizEditor();
}
function quizEditorRemoveQuestion(qi){
  QUIZ_EDIT_STATE.questions.splice(qi,1);
  renderQuizEditor();
}
function quizEditorUpdateField(qi, field, value){
  QUIZ_EDIT_STATE.questions[qi][field] = value;
}
function quizEditorUpdateOption(qi, oi, value){
  QUIZ_EDIT_STATE.questions[qi].options[oi] = value;
}
function quizEditorAddOption(qi){
  QUIZ_EDIT_STATE.questions[qi].options.push('');
  renderQuizEditor();
}
function quizEditorRemoveOption(qi, oi){
  const q = QUIZ_EDIT_STATE.questions[qi];
  q.options.splice(oi,1);
  if(q.correct_index>=q.options.length) q.correct_index = 0;
  renderQuizEditor();
}

async function saveQuizEditor(){
  const msgEl = document.getElementById('quiz-editor-msg');
  const questions = QUIZ_EDIT_STATE.questions.filter(q => (q.question||'').trim() && q.options.every(o=>(o||'').trim()));
  try{
    await callApi('saveQuizQuestions', { questions });
    if(msgEl){ msgEl.textContent='Questionnaire enregistré !'; setTimeout(()=>{ if(msgEl) msgEl.textContent=''; },2500); }
  }catch(e){ alert(tr(e.message)); }
}

/* ===== Séance de tir — géométrie FIBA, spots, rendu terrain, stats, interactions ===== */

const COURT_DIMENSIONS = {
  courtWidth: 15,
  halfCourtDepth: 14,
  basketFromBaseline: 1.575,
  backboardFromBaseline: 1.20,
  backboardWidth: 1.80,
  ringRadius: 0.225,
  freeThrowLineFromBaseline: 5.80,
  freeThrowCircleRadius: 1.80,
  keyWidth: 4.90,
  threePointRadius: 6.75,
  threePointSideOffset: 0.90,
  lineWidth: 0.05,
};

const CourtGeometry = (function(D){
  const halfWidth = D.courtWidth / 2;
  const keyHalfWidth = D.keyWidth / 2;
  const straightX = halfWidth - D.threePointSideOffset;
  const dy = Math.sqrt(D.threePointRadius*D.threePointRadius - straightX*straightX);
  const tangentY = D.basketFromBaseline + dy;
  const topOfArcY = D.basketFromBaseline + D.threePointRadius;
  const basket = { x: 0, y: D.basketFromBaseline };
  function distFromBasket(x, y){ return Math.hypot(x - basket.x, y - basket.y); }
  function threePointPath(){
    const R = D.threePointRadius.toFixed(4);
    const ty = tangentY.toFixed(4);
    return 'M ' + (-straightX) + ' 0 L ' + (-straightX) + ' ' + ty + ' A ' + R + ' ' + R + ' 0 0 0 ' + straightX + ' ' + ty + ' L ' + straightX + ' 0';
  }
  return {
    dims: D, halfWidth, keyHalfWidth, straightX, tangentY, topOfArcY, basket,
    distFromBasket, threePointPath,
    viewBox: { minX: -(halfWidth + 0.3), minY: -0.3, width: D.courtWidth + 0.6, height: D.halfCourtDepth + 0.6 },
  };
})(COURT_DIMENSIONS);

const SHOOTING_TARGET_PER_SPOT = 20;

const SHOOTING_SPOTS = (function(G){
  const wingAngle = 45 * Math.PI / 180;
  const wingX = G.dims.threePointRadius * Math.sin(wingAngle);
  const wingY = G.basket.y + G.dims.threePointRadius * Math.cos(wingAngle);
  const raw = [
    { id: 'corner-left',  key: '0g',  name: 'Corner gauche', x: -G.straightX, y: 1.00,       type: 'three-point' },
    { id: 'wing-left',    key: '45g', name: 'Aile gauche',   x: -wingX,       y: wingY,       type: 'three-point' },
    { id: 'top',          key: 'axe', name: 'Centre',        x: 0,            y: G.topOfArcY, type: 'three-point' },
    { id: 'wing-right',   key: '45d', name: 'Aile droite',   x: wingX,        y: wingY,       type: 'three-point' },
    { id: 'corner-right', key: '0d',  name: 'Corner droit',  x: G.straightX,  y: 1.00,       type: 'three-point' },
    { id: 'free-throw',   key: 'lf',  name: 'Lancer franc',  x: 0,            y: G.dims.freeThrowLineFromBaseline, type: 'free-throw' },
  ];
  return raw.map((s, i) => Object.assign({}, s, { index: i + 1, distance: Math.round(G.distFromBasket(s.x, s.y) * 100) / 100 }));
})(CourtGeometry);

function shootingSpotByKey(key){ return SHOOTING_SPOTS.find(s => s.key === key); }
function shootingBaseKey(stationKey){
  if(stationKey.startsWith('lf')) return 'lf';
  const parts = stationKey.split('_');
  return parts[1];
}

const ShootingStatistics = {
  pct(made, attempted){
    if(!attempted || attempted <= 0) return null;
    return Math.round((made/attempted)*1000)/10;
  },
  pctLabel(made, attempted){
    const p = this.pct(made, attempted);
    return p === null ? '—' : (String(p).replace('.', ',') + '%');
  },
  aggregateBySpot(entries){
    const map = {};
    SHOOTING_SPOTS.forEach(s => { map[s.key] = { spot: s, made: 0, attempted: 0 }; });
    (entries||[]).forEach(e => {
      const k = shootingBaseKey(e.station_key);
      if(map[k]){ map[k].made += e.made; map[k].attempted += e.attempted; }
    });
    return Object.values(map);
  },
  globalStats(entries){
    let made = 0, attempted = 0;
    (entries||[]).forEach(e => { made += e.made; attempted += e.attempted; });
    return { made, attempted, pct: this.pct(made, attempted) };
  },
  breakdownByType(entries){
    const threePt = { made:0, attempted:0 };
    const freeThrow = { made:0, attempted:0 };
    (entries||[]).forEach(e => {
      const target = e.station_key.startsWith('lf') ? freeThrow : threePt;
      target.made += e.made; target.attempted += e.attempted;
    });
    threePt.pct = this.pct(threePt.made, threePt.attempted);
    freeThrow.pct = this.pct(freeThrow.made, freeThrow.attempted);
    return { threePt, freeThrow };
  },
  bestAndWorstSpot(entries){
    const bySpot = this.aggregateBySpot(entries).filter(s => s.attempted > 0);
    if(!bySpot.length) return { best: null, worst: null };
    const withPct = bySpot.map(s => Object.assign({}, s, { pct: this.pct(s.made, s.attempted) }));
    withPct.sort((a,b) => b.pct - a.pct);
    return { best: withPct[0], worst: withPct[withPct.length-1] };
  },
};

const CourtRenderer = {
  render(stations, entries, currentIndex){
    const G = CourtGeometry, D = G.dims;
    const currentStation = stations[currentIndex-1];
    const passStart = currentIndex <= 6 ? 1 : 7;
    const doneKeysThisPass = new Set();
    for(let i=passStart; i<currentIndex; i++){
      const st = stations[i-1];
      if(st) doneKeysThisPass.add(shootingBaseKey(st.key));
    }
    const currentBase = currentStation ? shootingBaseKey(currentStation.key) : null;
    const vb = G.viewBox;
    const lw = D.lineWidth;
    const lineColor = 'var(--border2)';

    const boundary = '<rect x="' + (-G.halfWidth) + '" y="0" width="' + D.courtWidth + '" height="' + D.halfCourtDepth + '" fill="none" stroke="' + lineColor + '" stroke-width="' + lw + '"/>';
    const halfLine = '<line x1="' + (-G.halfWidth) + '" y1="' + D.halfCourtDepth + '" x2="' + G.halfWidth + '" y2="' + D.halfCourtDepth + '" stroke="' + lineColor + '" stroke-width="' + lw + '" opacity="0.55"/>';
    const key = '<rect x="' + (-G.keyHalfWidth) + '" y="0" width="' + D.keyWidth + '" height="' + D.freeThrowLineFromBaseline + '" fill="none" stroke="' + lineColor + '" stroke-width="' + lw + '"/>';
    const ftCircle = '<circle cx="0" cy="' + D.freeThrowLineFromBaseline + '" r="' + D.freeThrowCircleRadius + '" fill="none" stroke="' + lineColor + '" stroke-width="' + lw + '"/>';
    const backboard = '<line x1="' + (-D.backboardWidth/2) + '" y1="' + D.backboardFromBaseline + '" x2="' + (D.backboardWidth/2) + '" y2="' + D.backboardFromBaseline + '" stroke="' + lineColor + '" stroke-width="' + (lw*1.6) + '"/>';
    const ring = '<circle cx="0" cy="' + G.basket.y + '" r="' + D.ringRadius + '" fill="none" stroke="var(--gold)" stroke-width="' + lw + '"/>';
    const threePt = '<path d="' + G.threePointPath() + '" fill="none" stroke="' + lineColor + '" stroke-width="' + lw + '"/>';

    const spotHitR = 0.85;
    const spotVisR = 0.42;
    const dots = SHOOTING_SPOTS.map(sp => {
      let fill = 'var(--s2)', stroke = 'var(--border2)', tcolor = 'var(--w3)';
      if(sp.key === currentBase){ fill = 'var(--gold)'; stroke = 'var(--gold)'; tcolor = '#111'; }
      else if(doneKeysThisPass.has(sp.key)){ fill = 'var(--green)'; stroke = 'var(--green)'; tcolor = '#111'; }
      return '<g>' +
        '<circle cx="' + sp.x + '" cy="' + sp.y + '" r="' + spotHitR + '" fill="transparent"/>' +
        '<circle cx="' + sp.x + '" cy="' + sp.y + '" r="' + spotVisR + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (lw*1.4) + '"/>' +
        '<text x="' + sp.x + '" y="' + (sp.y + 0.16) + '" text-anchor="middle" font-size="0.42" font-weight="700" fill="' + tcolor + '" font-family="Inter,sans-serif">' + sp.index + '</text>' +
        '</g>';
    }).join('');

    return '<svg viewBox="' + vb.minX + ' ' + vb.minY + ' ' + vb.width + ' ' + vb.height + '" width="100%" style="max-width:400px;display:block;margin:0 auto">' +
      boundary + halfLine + key + ftCircle + threePt + backboard + ring + dots +
      '</svg>';
  },
};

async function submitShootingStation(){
  if(!SHOOTING_CTX) return;
  const input = document.getElementById('shot-count-input');
  const val = Number(input.value);
  if(!Number.isInteger(val) || val < 0 || val > SHOOTING_TARGET_PER_SPOT){
    alert(tr('Entre un nombre entier entre 0 et ' + SHOOTING_TARGET_PER_SPOT + '.'));
    return;
  }
  try{
    const r = await callApi('recordShootingStation', { session_id: SHOOTING_CTX.session.id, made: val, attempted: SHOOTING_TARGET_PER_SPOT });
    if(r.done){
      const detail = await callApi('getShootingSessionDetail', { session_id: r.session.id });
      const backId = _regShootingBack(openShootingHub);
      renderShootingSummary(detail.session, detail.entries, backId);
    } else {
      const activeR = await callApi('getActiveShootingSession', {});
      enterShootingStation(activeR.session, activeR.entries, activeR.stations);
    }
  }catch(e){ alert(tr(e.message)); }
}

function confirmCancelShooting(){
  if(!SHOOTING_CTX){ openShootingHub(); return; }
  if(confirm(tr('Abandonner cette séance ? La progression sera perdue.'))){
    const sid = SHOOTING_CTX.session.id;
    callApi('cancelShootingSession', { session_id: sid }).catch(() => {}).finally(() => { SHOOTING_CTX = null; openShootingHub(); });
  }
}

let IRONMAN_CTX = null;

function ironmanFormatTime(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const mm = String(Math.floor(s / 60)).padStart(2, "0");
  const ss = String(s % 60).padStart(2, "0");
  return mm + ":" + ss;
}

function ironmanStopTimer(){
  if(IRONMAN_CTX && IRONMAN_CTX.timerInterval){ clearInterval(IRONMAN_CTX.timerInterval); IRONMAN_CTX.timerInterval = null; }
}

function ironmanStartTimer(){
  ironmanStopTimer();
  if(!IRONMAN_CTX) return;
  IRONMAN_CTX.timerInterval = setInterval(() => {
    const el = document.getElementById("ironman-chrono");
    if(!el || !IRONMAN_CTX){ ironmanStopTimer(); return; }
    const secs = (Date.now() - IRONMAN_CTX.startedAtMs) / 1000;
    el.textContent = ironmanFormatTime(secs);
  }, 1000);
}
