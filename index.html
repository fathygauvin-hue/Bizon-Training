<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Bizon Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ============ RESET & TOKENS ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--w);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

:root{
  --font-body:'Inter',system-ui,sans-serif;
  --gold:#C9A227;--gold2:#E7C34B;--gold3:#C9A227;--gold4:rgba(201,162,39,0.13);
  --bg:#0a0a0a;--s1:#141412;--s2:#1f1f1c;--s3:#282824;--s4:#32322e;
  --w:#faf9f6;--w2:#c2c0b8;--w3:#8c8c84;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --green:#7BC47A;--green-bg:rgba(59,109,17,0.22);
  --red:#E07070;--red-bg:rgba(162,45,45,0.22);
  --blue:#7BAEE0;--blue-bg:rgba(24,95,165,0.2);
  --r8:8px;--r12:12px;--r16:16px;
}

#auth-root,#app-shell{background:var(--bg);min-height:100vh;width:100%;font-family:'Inter',sans-serif}
#app-shell{display:none;flex-direction:column}
#auth-root{display:none}
.app-frame{width:100%;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.bar-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:center;padding:0 32px;height:100%}
.botnav-inner{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center}

#topbar{height:60px;background:var(--s1);border-bottom:.5px solid var(--border);flex-shrink:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;max-width:1200px;margin:0 auto;width:100%;padding:0 32px}
#content::-webkit-scrollbar{width:0}
#botnav{height:70px;background:var(--s1);border-top:.5px solid var(--border);flex-shrink:0;padding-bottom:6px}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 0;user-select:none}
.nt svg{transition:stroke .2s}
.nt span{font-size:9px;color:var(--w3);letter-spacing:.6px;text-transform:uppercase;font-weight:500;transition:color .2s}
.nt.on svg{stroke:var(--gold)}
.nt.on span{color:var(--gold)}
.sec{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);letter-spacing:2px;padding:18px 16px 8px}
.card{background:var(--s2);border:.5px solid var(--border);border-radius:var(--r12);padding:14px;margin:0 14px 10px}
.pill{display:inline-flex;align-items:center;background:var(--gold4);border:.5px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--gold2);font-weight:500}
.tag{display:inline-flex;align-items:center;border-radius:var(--r8);padding:2px 8px;font-size:11px;font-weight:500}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.a{background:var(--gold4);color:var(--gold2)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.divhr{height:.5px;background:var(--border);margin:10px 0}
.gbtn{background:var(--gold);color:#0a0a0a;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:10px 16px;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:background .15s}
.gbtn:hover{background:var(--gold2)}
.gbtn.full{width:100%;text-align:center}
.ghost{background:var(--s3);color:var(--w2);font-family:'Inter',sans-serif;font-size:13px;padding:10px 16px;border-radius:var(--r8);border:.5px solid var(--border);cursor:pointer;transition:background .15s}
.ghost:hover{background:var(--s4)}
.ghost.full{width:100%;text-align:center}
.avatar{border-radius:50%;background:var(--gold3);display:flex;align-items:center;justify-content:center;font-weight:500;color:var(--gold2);flex-shrink:0}
.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sb-lbl{font-size:12px;color:var(--w2);width:76px;flex-shrink:0}
.sb-bg{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.sb-fill{height:100%;background:var(--gold3);border-radius:3px}
.sb-val{font-size:11px;color:var(--gold2);min-width:26px;text-align:right}
.tabs{display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tb{flex-shrink:0;padding:6px 16px;border-radius:20px;border:.5px solid var(--border);background:var(--s2);color:var(--w3);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .18s}
.tb.on{background:var(--gold4);border-color:var(--border2);color:var(--gold2)}
.finput{background:var(--s3);border:.5px solid var(--border);border-radius:var(--r8);padding:10px 12px;color:var(--w);font-family:'Inter',sans-serif;font-size:13px;width:100%;outline:none;margin-bottom:8px}
.finput:focus{border-color:var(--border2)}
textarea.finput{resize:none;line-height:1.5}
select.finput{cursor:pointer}
.app-grid-2{display:grid;grid-template-columns:1fr;gap:14px;padding:0 14px}
.app-grid-3{display:grid;grid-template-columns:1fr;gap:14px;padding:0 14px}
.app-grid-2 .card,.app-grid-3 .card{margin:0}
@media (min-width:760px){
  .app-grid-2{grid-template-columns:1fr 1fr}
  .app-grid-3{grid-template-columns:repeat(3,1fr)}
  .stats-grid{grid-template-columns:repeat(4,1fr)!important}
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.overlay{min-height:600px;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--s1);border:.5px solid var(--border2);border-radius:var(--r16);padding:20px;width:100%;max-width:420px}
</style>
</head>
<body>

<!-- ============ ACCÈS PAR CODE ============ -->
<div id="auth-root"></div>

<!-- ============ APP (joueur / coach) ============ -->
<div id="app-shell">
  <div class="app-frame">
    <div id="topbar">
      <div class="bar-inner">
        <div class="logo" style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:2.5px">Bizon Training</div>
      </div>
    </div>
    <div id="content"></div>
    <div id="botnav">
      <div class="botnav-inner">
        <div class="nt on" id="nt-suivi" onclick="nav('suivi')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><path d="M17 12l2 2 4-4"/></svg>
          <span>Suivi</span>
        </div>
        <div class="nt" id="nt-biblio" onclick="nav('biblio')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6760" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 00-4 10 14.5 14.5 0 004 10 14.5 14.5 0 004-10A14.5 14.5 0 0012 2z"/><path d="M2 12h20"/></svg>
          <span>Biblio</span>
        </div>
        <div class="nt" id="nt-profil" onclick="nav('profil')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6A6760" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span>Profil</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   SUPABASE
========================================================== */
const SUPABASE_URL = "https://shwtjplbjirgkgjtxrap.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tZk7-W_5TusA_hMtrtvhhA_9Fedr8cP";
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const APP_STATE = { authenticated:false, role:null, userId:null, user:null };
const CURRENT = { screen:'suivi', suivi:'joueur' };

/* ============ ACCÈS PAR CODE (remplace login email/mot de passe) ============ */
function genAccessCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sans caractères ambigus (0/O, 1/I)
  let code='';
  for(let i=0;i<6;i++) code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function showAccessScreen(prefill){
  document.getElementById('app-shell').style.display='none';
  const root=document.getElementById('auth-root');
  root.style.display='block';
  root.innerHTML=accessScreenHTML(prefill);
}

function accessScreenHTML(prefill){
  return `
  <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);max-width:420px;margin:0 auto;padding:24px">
    <div style="width:52px;height:52px;border-radius:14px;background:var(--gold3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--gold2)" stroke-width="1.3" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);letter-spacing:3px;margin-bottom:4px">BIZON TRAINING</div>
    <div style="font-size:12px;color:var(--w3);margin-bottom:24px">Entre ton code d'accès</div>
    <input class="finput" id="access-code-input" placeholder="Ex: J52WZY" maxlength="6" style="text-align:center;text-transform:uppercase;font-size:18px;letter-spacing:4px;max-width:220px" value="${prefill||''}" onkeydown="if(event.key==='Enter')handleAccessCode()"/>
    <button class="gbtn full" style="max-width:220px;margin-top:12px" onclick="handleAccessCode()">Entrer</button>
    <div id="access-error" style="color:var(--red);font-size:12px;margin-top:10px;text-align:center;max-width:260px"></div>
  </div>`;
}

async function handleAccessCode(){
  const input=document.getElementById('access-code-input');
  const code=(input.value||'').trim().toUpperCase();
  const errEl=document.getElementById('access-error');
  if(code.length!==6){
    errEl.textContent='Le code doit contenir 6 caractères.';
    input.classList.add('shake-anim');
    input.style.animation='shake .3s';
    setTimeout(()=>input.style.animation='',300);
    return;
  }
  errEl.textContent='Vérification…';
  const { data:profile, error } = await sbClient.from('profiles').select('*').eq('access_code', code).single();
  if(error || !profile){
    errEl.textContent='Code invalide. Vérifie et réessaie.';
    input.style.animation='shake .3s';
    setTimeout(()=>input.style.animation='',300);
    return;
  }
  errEl.textContent='';
  localStorage.setItem('bizon_access_code', code);
  await enterApp(profile);
}

async function enterApp(profile){
  APP_STATE.authenticated=true;
  APP_STATE.userId=profile.id;
  APP_STATE.role=profile.role || 'joueur';
  APP_STATE.user={
    name:`${profile.first_name||''} ${profile.last_name||''}`.trim(),
    accessCode:profile.access_code,
    position:profile.position,
    level:profile.level
  };
  CURRENT.suivi = APP_STATE.role==='coach' ? 'coach' : 'joueur';
  CURRENT.screen='suivi';
  document.getElementById('auth-root').style.display='none';
  document.getElementById('app-shell').style.display='flex';
  nav('suivi');
}

function handleLogout(){
  localStorage.removeItem('bizon_access_code');
  APP_STATE.authenticated=false; APP_STATE.role=null; APP_STATE.user=null; APP_STATE.userId=null;
  document.getElementById('app-shell').style.display='none';
  // Nettoie le ?code=XXXXXX de l'URL pour éviter une reconnexion auto involontaire
  const url=new URL(window.location.href);
  url.searchParams.delete('code');
  window.history.replaceState({}, '', url.toString());
  showAccessScreen();
}

/* Au chargement : lien ?code=XXXXXX (partagé par le coach) ou code déjà mémorisé sur l'appareil */
window.addEventListener('DOMContentLoaded', async () => {
  const params=new URLSearchParams(window.location.search);
  const urlCode=(params.get('code')||'').trim().toUpperCase();
  const savedCode=localStorage.getItem('bizon_access_code');
  const code = urlCode || savedCode;
  if(code && code.length===6){
    const { data:profile } = await sbClient.from('profiles').select('*').eq('access_code', code).single();
    if(profile){
      localStorage.setItem('bizon_access_code', code);
      await enterApp(profile);
      return;
    }
  }
  showAccessScreen(urlCode);
});

/* ============ NAVIGATION APP (bottom nav) ============ */
function nav(s){
  ['suivi','biblio','profil'].forEach(k=>{
    const el=document.getElementById('nt-'+k);
    if(!el)return;
    el.classList.toggle('on',k===s);
    el.querySelectorAll('svg').forEach(sv=>sv.style.stroke=k===s?'var(--gold)':'var(--w3)');
  });
  CURRENT.screen=s;
  render();
}

function render(){
  const c=document.getElementById('content');
  c.scrollTop=0;
  if(CURRENT.screen==='suivi') c.innerHTML=suiviHTML();
  else if(CURRENT.screen==='biblio') c.innerHTML=biblioHTML();
  else if(CURRENT.screen==='profil') c.innerHTML=profilHTML();
}

/* ═══ ÉVALUATION TECHNIQUE — LANCER FRANC (import Google Sheets publié en CSV) ═══ */
// Le lien Sheet est lu depuis profiles.sheet_lf pour chaque joueur.

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* ignoré */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseLancerFrancGrid(rows) {
  const dataRows = rows.slice(5);
  let currentEtape = '';
  const criteres = [];
  for (const r of dataRows) {
    const etapeCell = (r[0] || '').trim();
    const critereCell = (r[1] || '').trim();
    if (!critereCell) continue;
    if (etapeCell) currentEtape = etapeCell;
    const avant = parseFloat(r[2]);
    const commentAvant = (r[3] || '').trim();
    const apres = parseFloat(r[5]);
    const commentApres = (r[6] || '').trim();
    criteres.push({
      etape: currentEtape, critere: critereCell,
      avant: isNaN(avant) ? null : avant, commentAvant,
      apres: isNaN(apres) ? null : apres, commentApres,
    });
  }

  const groupes = {};
  criteres.forEach(c => {
    if (!groupes[c.etape]) groupes[c.etape] = { avant: [], apres: [] };
    if (c.avant !== null) groupes[c.etape].avant.push(c.avant);
    if (c.apres !== null) groupes[c.etape].apres.push(c.apres);
  });
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

  const etapes = Object.keys(groupes).map(etape => ({
    etape,
    moyenneAvant: avg(groupes[etape].avant),
    moyenneApres: avg(groupes[etape].apres),
  }));

  return { criteres, etapes };
}

function radarSVGDual(etapes) {
  const cx = 150, cy = 150, r = 105, n = etapes.length;
  if (!n) return '';
  let grid = '', polyAvant = '', polyApres = '', labels = '';
  for (let g = 1; g <= 4; g++) {
    const gr = r * g / 4; let gp = '';
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; gp += `${cx + gr * Math.cos(a)},${cy + gr * Math.sin(a)} `; }
    grid += `<polygon points="${gp}" fill="none" stroke="rgba(201,162,39,0.12)" stroke-width="0.5"/>`;
  }
  for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; grid += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}" stroke="rgba(201,162,39,0.08)" stroke-width="0.5"/>`; }
  etapes.forEach((e, i) => {
    const a = Math.PI * 2 * i / n - Math.PI / 2;
    const rvA = r * (e.moyenneAvant / 5), xA = cx + rvA * Math.cos(a), yA = cy + rvA * Math.sin(a);
    const rvP = r * (e.moyenneApres / 5), xP = cx + rvP * Math.cos(a), yP = cy + rvP * Math.sin(a);
    const lx = cx + (r + 26) * Math.cos(a), ly = cy + (r + 26) * Math.sin(a);
    polyAvant += `${xA},${yA} `;
    polyApres += `${xP},${yP} `;
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#8c8c84" font-size="8" font-family="Inter" letter-spacing="0.3">${e.etape}</text>`;
  });
  return `<svg width="300" height="300" viewBox="0 0 300 300">${grid}
    <polygon points="${polyAvant}" fill="rgba(250,249,246,0.08)" stroke="#8c8c84" stroke-width="1.5"/>
    <polygon points="${polyApres}" fill="rgba(201,162,39,0.25)" stroke="#C9A227" stroke-width="1.5"/>
    ${labels}</svg>`;
}

function renderLancerFrancEval(etapes, criteres) {
  if (!etapes.length) return `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucune donnée trouvée dans le Sheet.</div></div>`;
  const comments = (criteres || []).filter(c => c.commentAvant || c.commentApres);
  return `
  <div class="app-grid-2" style="padding:0">
    <div>
      <div class="card" style="display:flex;justify-content:center;margin:0">${radarSVGDual(etapes)}</div>
      <div style="display:flex;gap:14px;padding:10px 0 0;font-size:11px;color:var(--w3)">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#8c8c84;margin-right:5px"></span>Avant</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#C9A227;margin-right:5px"></span>Après</span>
      </div>
    </div>
    <div>
      <div class="sec" style="padding-left:0;padding-top:0">Détail par étape</div>
      <div class="card" style="margin:0">
        ${etapes.map(e => {
          const prog = e.moyenneApres - e.moyenneAvant;
          const progColor = prog > 0 ? 'var(--green)' : prog < 0 ? 'var(--red)' : 'var(--w3)';
          const progLabel = prog === 0 ? '—' : (prog > 0 ? '+' : '') + prog.toFixed(1);
          return `
          <div class="sb-row">
            <div class="sb-lbl" style="width:150px">${e.etape}</div>
            <div class="sb-bg"><div class="sb-fill" style="width:${(e.moyenneApres / 5) * 100}%"></div></div>
            <div class="sb-val">${e.moyenneApres.toFixed(1)}</div>
            <div style="font-size:11px;color:${progColor};min-width:34px;text-align:right">${progLabel}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  ${comments.length ? `
  <div class="sec" style="padding-left:0;padding-top:22px">Commentaires du coach</div>
  <div class="app-grid-3" style="padding:0">
    ${comments.map(c => `
    <div class="card">
      <div style="font-size:10px;color:var(--gold2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px">${c.etape} — ${c.critere}</div>
      ${c.commentAvant ? `<div style="font-size:12px;color:var(--w2);margin-bottom:3px"><b style="color:var(--w3)">Avant :</b> ${c.commentAvant}</div>` : ''}
      ${c.commentApres ? `<div style="font-size:12px;color:var(--w)"><b style="color:var(--w3)">Après :</b> ${c.commentApres}</div>` : ''}
    </div>`).join('')}
  </div>` : ''}
  <div style="height:24px"></div>`;
}

async function loadLancerFrancEval(playerId) {
  const el = document.getElementById('lf-eval-section');
  if (!el) return;
  if (!playerId) {
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Connecte-toi avec ton code d'accès pour voir tes données.</div></div>`;
    return;
  }
  try {
    const { data: profile, error: pErr } = await sbClient.from('profiles').select('sheet_lf').eq('id', playerId).single();
    if (pErr) throw pErr;
    if (!profile?.sheet_lf) {
      el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucun lien Google Sheet configuré pour ce joueur (Lancer franc).</div></div>`;
      return;
    }
    const res = await fetch(profile.sheet_lf);
    if (!res.ok) throw new Error('Réponse invalide');
    const text = await res.text();
    const { etapes, criteres } = parseLancerFrancGrid(parseCSV(text));
    el.innerHTML = renderLancerFrancEval(etapes, criteres);
  } catch (e) {
    console.error('Erreur chargement Lancer Franc:', e);
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger les données du Sheet Lancer Franc. Vérifie que le lien de publication est toujours actif.</div></div>`;
  }

/* ═══ ÉVALUATION TECHNIQUE — 2PTS / 3PTS (format checklist TRUE/FALSE) ═══ */
// Les liens Sheet sont lus depuis profiles.sheet_2pts / sheet_3pts.

const CHECKLIST_LABELS = {
  '3pts': '3 points après drive',
  '2pts': '2 points',
};

function parseChecklistGrid(rows) {
  let headerIdx = rows.findIndex(r => (r[0] || '').trim() === 'Étape' && (r[1] || '').trim().toLowerCase().includes('critère'));
  if (headerIdx === -1) headerIdx = 7;
  const dataRows = rows.slice(headerIdx + 1);

  let currentEtape = '';
  const criteres = [];
  for (const r of dataRows) {
    const etapeCell = (r[0] || '').trim();
    if (etapeCell.toUpperCase().includes('PRIORITÉS DE TRAVAIL')) break;
    const critereCell = (r[1] || '').trim();
    if (!critereCell) continue;
    if (etapeCell) currentEtape = etapeCell;
    let score = null;
    for (let s = 1; s <= 5; s++) {
      const cell = (r[1 + s] || '').trim().toUpperCase();
      if (cell === 'TRUE') { score = s; break; }
    }
    criteres.push({ etape: currentEtape, critere: critereCell, score });
  }

  const groupes = {};
  criteres.forEach(c => {
    if (!groupes[c.etape]) groupes[c.etape] = [];
    if (c.score !== null) groupes[c.etape].push(c.score);
  });
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const etapes = Object.keys(groupes).map(etape => ({ etape, moyenne: avg(groupes[etape]) }));

  return { criteres, etapes };
}

function radarSVGSingle(etapes) {
  const cx = 150, cy = 150, r = 105, n = etapes.length;
  if (!n) return '';
  let grid = '', poly = '', labels = '';
  for (let g = 1; g <= 4; g++) {
    const gr = r * g / 4; let gp = '';
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; gp += `${cx + gr * Math.cos(a)},${cy + gr * Math.sin(a)} `; }
    grid += `<polygon points="${gp}" fill="none" stroke="rgba(201,162,39,0.12)" stroke-width="0.5"/>`;
  }
  for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; grid += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}" stroke="rgba(201,162,39,0.08)" stroke-width="0.5"/>`; }
  etapes.forEach((e, i) => {
    const a = Math.PI * 2 * i / n - Math.PI / 2;
    const rv = r * (e.moyenne / 5), x = cx + rv * Math.cos(a), y = cy + rv * Math.sin(a);
    const lx = cx + (r + 26) * Math.cos(a), ly = cy + (r + 26) * Math.sin(a);
    poly += `${x},${y} `;
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#8c8c84" font-size="8" font-family="Inter" letter-spacing="0.3">${e.etape}</text>`;
  });
  return `<svg width="300" height="300" viewBox="0 0 300 300">${grid}<polygon points="${poly}" fill="rgba(201,162,39,0.25)" stroke="#C9A227" stroke-width="1.5"/>${labels}</svg>`;
}

function renderChecklistEval(etapes) {
  if (!etapes.length) return `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucune donnée trouvée dans le Sheet.</div></div>`;
  return `
  <div class="app-grid-2" style="padding:0">
    <div class="card" style="display:flex;justify-content:center;margin:0">${radarSVGSingle(etapes)}</div>
    <div>
      <div class="sec" style="padding-left:0;padding-top:0">Détail par étape</div>
      <div class="card" style="margin:0">
        ${etapes.map(e => `
        <div class="sb-row">
          <div class="sb-lbl" style="width:170px">${e.etape}</div>
          <div class="sb-bg"><div class="sb-fill" style="width:${(e.moyenne / 5) * 100}%"></div></div>
          <div class="sb-val">${e.moyenne.toFixed(1)}</div>
        </div>`).join('')}
      </div>
    </div>
  </div>
  <div style="height:24px"></div>`;
}

async function loadChecklistEval(key, playerId) {
  const el = document.getElementById('checklist-eval-section');
  if (!el) return;
  if (!playerId) {
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Connecte-toi avec ton code d'accès pour voir tes données.</div></div>`;
    return;
  }
  const column = key === '2pts' ? 'sheet_2pts' : 'sheet_3pts';
  try {
    const { data: profile, error: pErr } = await sbClient.from('profiles').select(column).eq('id', playerId).single();
    if (pErr) throw pErr;
    const url = profile ? profile[column] : null;
    if (!url) {
      el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucun lien Google Sheet configuré pour ce joueur (${CHECKLIST_LABELS[key]}).</div></div>`;
      return;
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error('Réponse invalide');
    const text = await res.text();
    const { etapes } = parseChecklistGrid(parseCSV(text));
    el.innerHTML = renderChecklistEval(etapes);
  } catch (e) {
    console.error('Erreur chargement checklist:', e);
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger les données du Sheet. Vérifie que le lien de publication est toujours actif.</div></div>`;
  }
}

    <div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer">
      <div style="width:42px;height:42px;border-radius:var(--r8);background:${e.free?'var(--gold4)':'rgba(24,95,165,0.2)'};border:.5px solid ${e.free?'var(--border2)':'rgba(123,174,224,0.3)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${e.free?'var(--gold)':'var(--blue)'}" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 00-4 10 14.5 14.5 0 004 10 14.5 14.5 0 004-10A14.5 14.5 0 0012 2z"/><path d="M2 12h20"/></svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:500;color:var(--w)">${e.n}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
          <span class="tag ${e.free?'a':'b'}" style="font-size:10px">${e.cat}</span>
          ${!e.free?`<span class="tag b" style="font-size:10px">Premium</span>`:''}
        </div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="${e.fav?'var(--gold)':'none'}" stroke="var(--gold)" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
    </div>`).join('')}
  </div>
  <div style="height:16px"></div>`;
}

/* ═══ PROFIL ═══ */
function profilHTML(){
  const name = APP_STATE.user?.name || '';
  const isCoach = APP_STATE.role==='coach';
  const role = isCoach ? 'Coach' : ([APP_STATE.user?.position, APP_STATE.user?.level].filter(Boolean).join(' · ') || 'Joueur');
  const initials = (name.split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('') || '?').toUpperCase();
  return `
  <div style="padding:28px 0 12px;display:flex;flex-direction:column;align-items:center;gap:10px">
    <div style="width:70px;height:70px;border-radius:50%;background:var(--gold3);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold2)">${initials}</div>
    <div style="text-align:center">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--w);letter-spacing:1px">${name}</div>
      <div style="font-size:12px;color:var(--w3)">${role}</div>
    </div>
  </div>
  <div class="sec" style="padding-left:0">Mon code d'accès</div>
  <div class="card" style="text-align:center;font-size:18px;letter-spacing:4px;color:var(--gold2);font-family:monospace">${APP_STATE.user?.accessCode || ''}</div>
  <div class="sec" style="padding-left:0;padding-top:22px">Compte</div>
  <div class="app-grid-2" style="padding:0">
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border-color:var(--red-bg)" onclick="handleLogout()">
      <span style="font-size:14px;color:var(--red)">Déconnexion</span>
    </div>
  </div>
  <div style="height:28px"></div>`;
}
</script>
</body>
</html>
