/* ============ RESET & TOKENS ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--w);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

:root{
  --font-body:'Inter',system-ui,sans-serif;
  --gold:#C9A227;--gold2:#E7C34B;--gold3:#C9A227;--gold4:rgba(201,162,39,0.13);
  --bg:#0a0a0a;--s1:#141412;--s2:#1f1f1c;--s3:#282824;--s4:#32322e;
  --w:#faf9f6;--w2:#c2c0b8;--w3:#8c8c84;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
  --green:#7BC47A;--green-bg:rgba(59,109,17,0.22);
  --red:#E07070;--red-bg:rgba(162,45,45,0.22);
  --blue:#7BAEE0;--blue-bg:rgba(24,95,165,0.2);
  --r8:8px;--r12:12px;--r16:16px;
}

#auth-root,#app-shell{background:var(--bg);min-height:100vh;width:100%;font-family:'Inter',sans-serif}
#app-shell{display:none;flex-direction:column}
#auth-root{display:none}
.app-frame{width:100%;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.bar-inner{max-width:1200px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:center;padding:0 32px;height:100%}
.botnav-inner{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center}

#topbar{height:60px;background:var(--s1);border-bottom:.5px solid var(--border);flex-shrink:0}
#content{flex:1;overflow-y:auto;overflow-x:hidden;max-width:1200px;margin:0 auto;width:100%;padding:0 32px}
#content::-webkit-scrollbar{width:0}
#botnav{height:70px;background:var(--s1);border-top:.5px solid var(--border);flex-shrink:0;padding-bottom:6px}
.nt{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:8px 0;user-select:none}
.nt svg{transition:stroke .2s}
.nt span{font-size:9px;color:var(--w3);letter-spacing:.6px;text-transform:uppercase;font-weight:500;transition:color .2s}
.nt.on svg{stroke:var(--gold)}
.nt.on span{color:var(--gold)}
.sec{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--gold);letter-spacing:2px;padding:18px 16px 8px}
.card{background:var(--s2);border:.5px solid var(--border);border-radius:var(--r12);padding:14px;margin:0 14px 10px}
.pill{display:inline-flex;align-items:center;background:var(--gold4);border:.5px solid var(--border2);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--gold2);font-weight:500}
.tag{display:inline-flex;align-items:center;border-radius:var(--r8);padding:2px 8px;font-size:11px;font-weight:500}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.a{background:var(--gold4);color:var(--gold2)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.divhr{height:.5px;background:var(--border);margin:10px 0}
.gbtn{background:var(--gold);color:#0a0a0a;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;padding:10px 16px;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:background .15s}
.gbtn:hover{background:var(--gold2)}
.gbtn.full{width:100%;text-align:center}
.ghost{background:var(--s3);color:var(--w2);font-family:'Inter',sans-serif;font-size:13px;padding:10px 16px;border-radius:var(--r8);border:.5px solid var(--border);cursor:pointer;transition:background .15s}
.ghost:hover{background:var(--s4)}
.ghost.full{width:100%;text-align:center}

.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sb-lbl{font-size:12px;color:var(--w2);width:76px;flex-shrink:0}
.sb-bg{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.sb-fill{height:100%;background:var(--gold3);border-radius:3px}
.sb-val{font-size:11px;color:var(--gold2);min-width:26px;text-align:right}
.tabs{display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto}

.tb{flex-shrink:0;padding:6px 16px;border-radius:20px;border:.5px solid var(--border);background:var(--s2);color:var(--w3);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .18s}

select.finput{cursor:pointer}
.app-grid-2{display:grid;grid-template-columns:1fr;gap:14px;padding:0 14px}
.app-grid-3{display:grid;grid-template-columns:1fr;gap:14px;padding:0 14px}
.app-grid-2 .card,.app-grid-3 .card{margin:0}

/* ==========================================================
   API — toutes les opérations Supabase passent par l'Edge Function "api"
   (le code d'accès est vérifié côté serveur, la clé anon ne donne plus
   aucun accès direct aux tables : voir RLS + revoke sur profiles/videos)
========================================================== */
const SUPABASE_URL = "https://shwtjplbjirgkgjtxrap.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tZk7-W_5TusA_hMtrtvhhA_9Fedr8cP";
const EDGE_FN_URL = "https://shwtjplbjirgkgjtxrap.supabase.co/functions/v1/api";

async function callApi(action, payload = {}) {
  const code = APP_STATE.code || localStorage.getItem('bizon_access_code') || '';
  const res = await fetch(EDGE_FN_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'apikey': SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ action, code, ...payload }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

// Upload direct du fichier vers Supabase Storage via une URL signée à usage unique
// (obtenue depuis l'Edge Function "api" — le token autorise uniquement CET upload précis).
async function uploadToSignedUrl(path, token, file) {
  const url = `${SUPABASE_URL}/storage/v1/object/upload/sign/athlete-videos/${path}?token=${token}`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': file.type || 'video/mp4',
      'x-upsert': 'false',
    },
    body: file,
  });
  if (!res.ok) { const t = await res.text().catch(()=> ''); throw new Error('Échec de l\'envoi de la vidéo (' + res.status + ') ' + t); }
  return true;
}

// Extraction d'images fixes depuis une vidéo (canvas) pour le premier avis IA — aucun envoi de fichier vidéo entier, juste quelques images compressées.
function seekToTime(video, t){
  return new Promise((resolve) => {
    const onSeeked = () => { video.removeEventListener('seeked', onSeeked); resolve(); };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

async function extractVideoFrames(url, count = 4){
  const video = document.createElement('video');
  video.crossOrigin = 'anonymous';
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  await new Promise((resolve, reject) => {
    video.addEventListener('loadedmetadata', resolve, { once: true });
    video.addEventListener('error', () => reject(new Error("Impossible de charger la vidéo pour l'analyse.")), { once: true });
    video.src = url;
  });
  const duration = video.duration;
  if (!isFinite(duration) || duration <= 0) throw new Error("Durée de vidéo invalide pour l'analyse.");
  const canvas = document.createElement('canvas');
  canvas.width = Math.min(480, video.videoWidth || 480);
  canvas.height = Math.round(canvas.width * (video.videoHeight || 360) / (video.videoWidth || 480));
  const ctx = canvas.getContext('2d');
  const ratios = [0.15, 0.4, 0.65, 0.9].slice(0, count);
  const frames = [];
  for (const r of ratios) {
    await seekToTime(video, duration * r);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    let dataUrl;
    try {
      dataUrl = canvas.toDataURL('image/jpeg', 0.7);
    } catch (e) {
      throw new Error("Impossible d'extraire les images de la vidéo (restriction du navigateur).");
    }
    frames.push(dataUrl.split(',')[1]);
  }
  return frames;
}

// Trier les clés par longueur décroissante pour que les phrases longues et
// spécifiques soient remplacées avant les fragments génériques plus courts.
const I18N_ENTRIES = Object.entries(I18N_DICT).sort((a, b) => b[0].length - a[0].length);

function tr(str) {
  if (APP_STATE.language !== 'en' || typeof str !== 'string' || !str) return str;
  let out = str;
  for (const [fr, en] of I18N_ENTRIES) {
    if (out.indexOf(fr) !== -1) out = out.split(fr).join(en);
  }
  return out;
}

// Traduction transparente de tout innerHTML / textContent assigné pendant
// que la langue active est l'anglais — couvre l'intégralité de l'app sans
// devoir modifier chaque site d'affectation individuellement.
(function () {
  const ihDesc = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(Element.prototype, 'innerHTML', {
    configurable: true,
    enumerable: true,
    get: function () { return ihDesc.get.call(this); },
    set: function (html) { ihDesc.set.call(this, tr(html)); },
  });
  const tcDesc = Object.getOwnPropertyDescriptor(Node.prototype, 'textContent');
  Object.defineProperty(Node.prototype, 'textContent', {
    configurable: true,
    enumerable: true,
    get: function () { return tcDesc.get.call(this); },
    set: function (text) { tcDesc.set.call(this, tr(text)); },
  });
})();

/* ═══ ÉVALUATION TECHNIQUE — LANCER FRANC (import Google Sheets publié en CSV) ═══ */
// Le lien Sheet est lu depuis profiles.sheet_lf pour chaque joueur.

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* ignoré */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseLancerFrancGrid(rows) {
  const dataRows = rows.slice(5);
  let currentEtape = '';
  const criteres = [];
  for (const r of dataRows) {
    const etapeCell = (r[0] || '').trim();
    const critereCell = (r[1] || '').trim();
    if (!critereCell) continue;
    if (etapeCell) currentEtape = etapeCell;
    const avant = parseFloat(r[2]);
    const commentAvant = (r[3] || '').trim();
    const apres = parseFloat(r[5]);
    const commentApres = (r[6] || '').trim();
    criteres.push({
      etape: currentEtape, critere: critereCell,
      avant: isNaN(avant) ? null : avant, commentAvant,
      apres: isNaN(apres) ? null : apres, commentApres,
    });
  }

  const groupes = {};
  criteres.forEach(c => {
    if (!groupes[c.etape]) groupes[c.etape] = { avant: [], apres: [] };
    if (c.avant !== null) groupes[c.etape].avant.push(c.avant);
    if (c.apres !== null) groupes[c.etape].apres.push(c.apres);
  });
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

  const etapes = Object.keys(groupes).map(etape => ({
    etape,
    moyenneAvant: avg(groupes[etape].avant),
    moyenneApres: avg(groupes[etape].apres),
  }));

  return { criteres, etapes };
}

function radarSVGDual(etapes) {
  const cx = 150, cy = 150, r = 105, n = etapes.length;
  if (!n) return '';
  let grid = '', polyAvant = '', polyApres = '', labels = '';
  for (let g = 1; g <= 4; g++) {
    const gr = r * g / 4; let gp = '';
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; gp += `${cx + gr * Math.cos(a)},${cy + gr * Math.sin(a)} `; }
    grid += `<polygon points="${gp}" fill="none" stroke="rgba(201,162,39,0.12)" stroke-width="0.5"/>`;
  }
  for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; grid += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}" stroke="rgba(201,162,39,0.08)" stroke-width="0.5"/>`; }
  etapes.forEach((e, i) => {
    const a = Math.PI * 2 * i / n - Math.PI / 2;
    const rvA = r * (e.moyenneAvant / 5), xA = cx + rvA * Math.cos(a), yA = cy + rvA * Math.sin(a);
    const rvP = r * (e.moyenneApres / 5), xP = cx + rvP * Math.cos(a), yP = cy + rvP * Math.sin(a);
    const lx = cx + (r + 26) * Math.cos(a), ly = cy + (r + 26) * Math.sin(a);
    polyAvant += `${xA},${yA} `;
    polyApres += `${xP},${yP} `;
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#8c8c84" font-size="8" font-family="Inter" letter-spacing="0.3">${e.etape}</text>`;
  });
  return `<svg width="300" height="300" viewBox="0 0 300 300">${grid}
    <polygon points="${polyAvant}" fill="rgba(250,249,246,0.08)" stroke="#8c8c84" stroke-width="1.5"/>
    <polygon points="${polyApres}" fill="rgba(201,162,39,0.25)" stroke="#C9A227" stroke-width="1.5"/>
    ${labels}</svg>`;
}

async function loadLancerFrancEval(playerId) {
  const el = document.getElementById('lf-eval-section');
  if (!el) return;
  if (!playerId) {
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Connecte-toi avec ton code d'accès pour voir tes données.</div></div>`;
    return;
  }
  try {
    let sheets;
    try {
      const data = await callApi('getSheetLinks', { playerId });
      sheets = data.sheets;
    } catch (aErr) { aErr._stage = 'supabase'; throw aErr; }
    if (!sheets?.sheet_lf) {
      el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucun lien Google Sheet configuré pour ce joueur (Lancer franc).</div></div>`;
      return;
    }
    let res;
    try {
      res = await fetch(sheets.sheet_lf);
    } catch (fe) { fe._stage = 'fetch-network'; throw fe; }
    if (!res.ok) { const e2 = new Error('HTTP ' + res.status); e2._stage = 'fetch-http'; throw e2; }
    const text = await res.text();
    const { etapes, criteres } = parseLancerFrancGrid(parseCSV(text));
    el.innerHTML = renderLancerFrancEval(etapes, criteres);
  } catch (e) {
    console.error('Erreur chargement Lancer Franc:', e);
    const stage = e._stage || 'inconnu';
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger les données du Sheet Lancer Franc.</div><div style="font-size:11px;color:var(--w3);margin-top:8px;font-family:monospace">Étape: ${stage}<br>Détail: ${(e.message || String(e)).replace(/</g,'&lt;')}</div></div>`;
  }
}

/* ═══ ÉVALUATION TECHNIQUE — 2PTS / 3PTS (format checklist TRUE/FALSE) ═══ */
// Les liens Sheet sont lus depuis profiles.sheet_2pts / sheet_3pts.

const CHECKLIST_LABELS = {
  '3pts': '3 points après drive',
  '2pts': '2 points',
  'diagnostic': 'Diagnostic général',
};

function parseChecklistGrid(rows) {
  let headerIdx = rows.findIndex(r => (r[0] || '').trim() === 'Étape' && (r[1] || '').trim().toLowerCase().includes('critère'));
  if (headerIdx === -1) headerIdx = 7;
  const dataRows = rows.slice(headerIdx + 1);

  let currentEtape = '';
  const criteres = [];
  for (const r of dataRows) {
    const etapeCell = (r[0] || '').trim();
    if (etapeCell.toUpperCase().includes('PRIORITÉS DE TRAVAIL')) break;
    const critereCell = (r[1] || '').trim();
    if (!critereCell) continue;
    if (etapeCell) currentEtape = etapeCell;
    let score = null;
    for (let s = 1; s <= 5; s++) {
      const cell = (r[1 + s] || '').trim().toUpperCase();
      if (cell === 'TRUE') { score = s; break; }
    }
    criteres.push({ etape: currentEtape, critere: critereCell, score });
  }

  const groupes = {};
  criteres.forEach(c => {
    if (!groupes[c.etape]) groupes[c.etape] = [];
    if (c.score !== null) groupes[c.etape].push(c.score);
  });
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const etapes = Object.keys(groupes).map(etape => ({ etape, moyenne: avg(groupes[etape]) }));

  return { criteres, etapes };
}

function radarSVGSingle(etapes) {
  const cx = 150, cy = 150, r = 105, n = etapes.length;
  if (!n) return '';
  let grid = '', poly = '', labels = '';
  for (let g = 1; g <= 4; g++) {
    const gr = r * g / 4; let gp = '';
    for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; gp += `${cx + gr * Math.cos(a)},${cy + gr * Math.sin(a)} `; }
    grid += `<polygon points="${gp}" fill="none" stroke="rgba(201,162,39,0.12)" stroke-width="0.5"/>`;
  }
  for (let i = 0; i < n; i++) { const a = Math.PI * 2 * i / n - Math.PI / 2; grid += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}" stroke="rgba(201,162,39,0.08)" stroke-width="0.5"/>`; }
  etapes.forEach((e, i) => {
    const a = Math.PI * 2 * i / n - Math.PI / 2;
    const rv = r * (e.moyenne / 5), x = cx + rv * Math.cos(a), y = cy + rv * Math.sin(a);
    const lx = cx + (r + 26) * Math.cos(a), ly = cy + (r + 26) * Math.sin(a);
    poly += `${x},${y} `;
    labels += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#8c8c84" font-size="8" font-family="Inter" letter-spacing="0.3">${e.etape}</text>`;
  });
  return `<svg width="300" height="300" viewBox="0 0 300 300">${grid}<polygon points="${poly}" fill="rgba(201,162,39,0.25)" stroke="#C9A227" stroke-width="1.5"/>${labels}</svg>`;
}

async function loadChecklistEval(key, playerId) {
  const el = document.getElementById('checklist-eval-section');
  if (!el) return;
  if (!playerId) {
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Connecte-toi avec ton code d'accès pour voir tes données.</div></div>`;
    return;
  }
  const column = key === '2pts' ? 'sheet_2pts' : key === '3pts' ? 'sheet_3pts' : 'sheet_diagnostic';
  try {
    let sheets;
    try {
      const data = await callApi('getSheetLinks', { playerId });
      sheets = data.sheets;
    } catch (aErr) { aErr._stage = 'supabase'; throw aErr; }
    const url = sheets ? sheets[column] : null;
    if (!url) {
      el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucun lien Google Sheet configuré pour ce joueur (${CHECKLIST_LABELS[key]}).</div></div>`;
      return;
    }
    let res;
    try {
      res = await fetch(url);
    } catch (fe) { fe._stage = 'fetch-network'; throw fe; }
    if (!res.ok) { const e2 = new Error('HTTP ' + res.status); e2._stage = 'fetch-http'; throw e2; }
    const text = await res.text();
    if (key === '2pts' || key === '3pts' || key === 'diagnostic') {
      // Les formats "2 points" et "3 points" utilisent désormais la grille Avant/Après (comme Lancer franc).
      const { etapes, criteres } = parseLancerFrancGrid(parseCSV(text));
      el.innerHTML = renderLancerFrancEval(etapes, criteres);
    } else {
      const { etapes } = parseChecklistGrid(parseCSV(text));
      el.innerHTML = renderChecklistEval(etapes);
    }
  } catch (e) {
    console.error('Erreur chargement checklist:', e);
    const stage = e._stage || 'inconnu';
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger les données du Sheet.</div><div style="font-size:11px;color:var(--w3);margin-top:8px;font-family:monospace">Étape: ${stage}<br>Détail: ${(e.message || String(e)).replace(/</g,'&lt;')}</div></div>`;
  }
}

  if(!dateStr) return null;
  const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  if(APP_STATE.language==='en'){
    if(days<=0) return 'today';
    if(days===1) return 'yesterday';
    return `${days}d ago`;
  }
  if(days<=0) return "aujourd'hui";
  if(days===1) return "hier";
  return `il y a ${days} j`;
}

  try {
    const { players } = await callApi('listPlayers', {});

    if (!players || !players.length) {
      el.innerHTML = `<div class="card" style="grid-column:1/-1"><div style="font-size:12px;color:var(--w3)">Aucun joueur rattaché pour l'instant. Ajoute ton premier joueur ci-dessous.</div></div>`;

    const staleOrNever = players.filter(p => {
      if (!p.last_note_at) return true;

    }).length;
    let pendingVideos = 0;
    try { const s = await callApi('getCoachSubmissionsSummary', {}); pendingVideos = s.pendingCount || 0; } catch(e) {}

    if (statsEl) {
      statsEl.innerHTML = `

      </div>`;

      const role = [p.position, p.level].filter(Boolean).join(' · ') || 'Joueur';
      const noteDays = p.last_note_at ? (now - new Date(p.last_note_at).getTime()) / 86400000 : Infinity;
      const noteTagClass = noteDays <= 7 ? 'g' : noteDays <= STALE_DAYS ? 'a' : 'r';
      const noteLabel = p.last_note_at ? 'Suivi ' + relativeDaysFR(p.last_note_at) : 'Aucun suivi';
      return `
      <div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer;margin:0" onclick="openPlayerDetail('${p.id}','${name.replace(/'/g, "\\'")}')">

            ${!p.sheets_configured ? `<span class="tag r" style="font-size:10px">Sheets à configurer</span>` : ''}
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--w3)" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Erreur chargement joueurs:', e);
    el.innerHTML = `<div class="card" style="grid-column:1/-1"><div style="font-size:12px;color:var(--red)">Impossible de charger la liste des joueurs.</div></div>`;
    if (statsEl) statsEl.innerHTML = '';
  }
}

          <div style="margin-top:10px;padding-top:10px;border-top:.5px solid var(--border)">

async function analyzeSubmission(submissionId, playerId){
  const container = document.getElementById('ai-block-'+submissionId);
  if(container) container.innerHTML = `<div style="font-size:12px;color:var(--w3);margin-top:10px">Analyse en cours… (extraction des images puis appel IA)</div>`;

    if(container) container.innerHTML = `<div style="font-size:12px;color:var(--red);margin-top:10px">${e.message}</div>`;
  }
}

// Extrait l'ID de fichier depuis un lien Google Drive (formats /file/d/ID/... ou ?id=ID)
function driveFileId(url){
  if(!url) return null;
  let m = url.match(/\/d\/([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]{20,})/);
  if(m) return m[1];
  return null;
}

/* ═══ VISION DE JEU — questionnaire e-learning ═══ */
const QUIZ_STATE = { questions: [], answers: {} };
let QUIZ_EDIT_STATE = { questions: [] };

function quizOptionLetter(i){ return String.fromCharCode(65+i); }

async function openVisionQuiz(){
  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)">
      <button onclick="nav('suivi')" style="background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;line-height:1">‹</button>
      <div style="font-size:14px;font-weight:500;color:var(--w)">Vision de jeu</div>
    </div>
    <div id="vision-quiz-section" style="padding:20px 0;text-align:center;color:var(--w3);font-size:12px">Chargement du questionnaire…</div>
  `;
  await loadVisionQuiz();
}

async function loadVisionQuiz(){
  const el = document.getElementById('vision-quiz-section');
  if(!el) return;
  try{
    const { questions } = await callApi('getQuizForPlayer', {});
    if(!questions || !questions.length){
      el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--w3)">Aucune question disponible pour l'instant.</div></div>`;
      return;
    }
    QUIZ_STATE.questions = questions;
    QUIZ_STATE.answers = {};
    el.innerHTML = `
      <div class="sec" style="padding-left:0;padding-top:0">Questionnaire (${questions.length} questions)</div>
      ${questions.map((q,qi) => `
      <div class="card">
        <div style="font-size:13px;color:var(--w);margin-bottom:10px">${qi+1}. ${(q.question||'').replace(/</g,'&lt;')}</div>
        ${(q.options||[]).map((opt,oi) => `
        <label style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;font-size:12px;color:var(--w2)">
          <input type="radio" name="quiz-q-${q.id}" value="${oi}" onchange="QUIZ_STATE.answers['${q.id}']=${oi}"/>
          ${quizOptionLetter(oi)}. ${(opt||'').replace(/</g,'&lt;')}
        </label>`).join('')}
      </div>`).join('')}
      <div id="vision-quiz-msg" style="font-size:12px;color:var(--red);margin-bottom:8px"></div>
      <button class="gbtn full" onclick="submitVisionQuiz()">Valider mes réponses</button>
      <div style="height:24px"></div>
    `;
  }catch(e){
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger le questionnaire.</div></div>`;
  }
}

async function submitVisionQuiz(){
  const msgEl = document.getElementById('vision-quiz-msg');
  if(Object.keys(QUIZ_STATE.answers).length < QUIZ_STATE.questions.length){
    if(msgEl) msgEl.textContent = 'Réponds à toutes les questions avant de valider.';
    return;
  }
  try{
    const { score, total } = await callApi('submitQuizAttempt', { answers: QUIZ_STATE.answers });
    document.getElementById('vision-quiz-section').innerHTML = `
      <div class="card" style="text-align:center;padding:28px 14px">
        <div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Résultat</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--gold2)">${score} / ${total}</div>
      </div>
      <button class="ghost full" style="margin-top:14px" onclick="openVisionQuiz()">Recommencer</button>
      <div style="height:24px"></div>
    `;
  }catch(e){ if(msgEl) msgEl.textContent = e.message; }
}

async function loadPlayerQuizResults(playerId){
  const el = document.getElementById('player-quiz-results');
  if(!el) return;
  try{
    const { attempts } = await callApi('getPlayerQuizResults', { playerId });
    if(!attempts || !attempts.length){
      el.innerHTML = `<div style="font-size:12px;color:var(--w3)">Ce joueur n'a pas encore répondu au questionnaire.</div>`;
      return;
    }
    el.innerHTML = attempts.map(a => {
      const d = new Date(a.created_at);
      const dateStr = d.toLocaleDateString(LOCALE(), { day:'2-digit', month:'short', year:'numeric' });

        <span style="color:var(--w2)">${dateStr}</span>
        <span style="color:var(--gold2)">${a.score} / ${a.total}</span>
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML = `<div style="font-size:12px;color:var(--red)">Impossible de charger les résultats.</div>`;
  }
}

function openQuizEditor(){
  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)">
      <button onclick="nav('profil')" style="background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;line-height:1">‹</button>
      <div style="font-size:14px;font-weight:500;color:var(--w)">Questionnaire · Vision de jeu</div>
    </div>
    <div id="quiz-editor-section" style="padding:20px 0;text-align:center;color:var(--w3);font-size:12px">Chargement…</div>
  `;
  loadQuizEditor();
}

async function loadQuizEditor(){
  const el = document.getElementById('quiz-editor-section');
  if(!el) return;
  try{
    const { questions } = await callApi('getQuizQuestions', {});
    QUIZ_EDIT_STATE.questions = (questions||[]).map(q => ({ question: q.question, options: q.options, correct_index: q.correct_index }));
    renderQuizEditor();
  }catch(e){
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger les questions.</div></div>`;
  }
}

function renderQuizEditor(){
  const el = document.getElementById('quiz-editor-section');
  if(!el) return;
  const qs = QUIZ_EDIT_STATE.questions;
  el.innerHTML = `
    <div style="font-size:11px;color:var(--w3);line-height:1.5;margin:0 0 12px">Rédige les questions du QCM "Vision de jeu". Sélectionne la bonne réponse pour chaque question.</div>
    ${qs.map((q,qi) => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.6px">Question ${qi+1}</div>
        <button class="ghost" style="color:var(--red);font-size:11px;padding:4px 8px" onclick="quizEditorRemoveQuestion(${qi})">Supprimer</button>
      </div>
      <textarea class="finput" rows="2" style="resize:vertical" placeholder="Énoncé de la question" oninput="quizEditorUpdateField(${qi},'question',this.value)">${(q.question||'').replace(/</g,'&lt;')}</textarea>
      ${q.options.map((opt,oi) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <input type="radio" name="correct-${qi}" ${q.correct_index===oi?'checked':''} onchange="quizEditorUpdateField(${qi},'correct_index',${oi})"/>
        <input class="finput" style="margin:0" value="${(opt||'').replace(/</g,'&lt;')}" placeholder="Option ${quizOptionLetter(oi)}" oninput="quizEditorUpdateOption(${qi},${oi},this.value)"/>
        ${q.options.length>2 ? `<button class="ghost" style="padding:4px 8px;font-size:11px" onclick="quizEditorRemoveOption(${qi},${oi})">✕</button>` : ''}
      </div>`).join('')}
      <button class="ghost" style="font-size:11px;padding:6px 10px" onclick="quizEditorAddOption(${qi})">+ Option</button>
    </div>`).join('')}
    <button class="ghost full" onclick="quizEditorAddQuestion()">+ Ajouter une question</button>
    <div id="quiz-editor-msg" style="font-size:12px;color:var(--green);margin:10px 0 6px"></div>
    <button class="gbtn full" onclick="saveQuizEditor()">Enregistrer le questionnaire</button>
    <div style="height:24px"></div>
  `;
}

function quizEditorAddQuestion(){
  QUIZ_EDIT_STATE.questions.push({ question:'', options:['',''], correct_index:0 });
  renderQuizEditor();
}
function quizEditorRemoveQuestion(qi){
  QUIZ_EDIT_STATE.questions.splice(qi,1);
  renderQuizEditor();
}
function quizEditorUpdateField(qi, field, value){
  QUIZ_EDIT_STATE.questions[qi][field] = value;
}
function quizEditorUpdateOption(qi, oi, value){
  QUIZ_EDIT_STATE.questions[qi].options[oi] = value;
}
function quizEditorAddOption(qi){
  QUIZ_EDIT_STATE.questions[qi].options.push('');
  renderQuizEditor();
}
function quizEditorRemoveOption(qi, oi){
  const q = QUIZ_EDIT_STATE.questions[qi];
  q.options.splice(oi,1);
  if(q.correct_index>=q.options.length) q.correct_index = 0;
  renderQuizEditor();
}

async function saveQuizEditor(){
  const msgEl = document.getElementById('quiz-editor-msg');
  const questions = QUIZ_EDIT_STATE.questions.filter(q => (q.question||'').trim() && q.options.every(o=>(o||'').trim()));
  try{
    await callApi('saveQuizQuestions', { questions });
    if(msgEl){ msgEl.textContent='Questionnaire enregistré !'; setTimeout(()=>{ if(msgEl) msgEl.textContent=''; },2500); }
  }catch(e){ alert(tr(e.message)); }
}

/* ═══ CALENDRIER — disponibilités du joueur + programme d'entraînement récurrent ═══ */
const JOURS_SEMAINE = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

async function openMyCalendar(){
  document.getElementById('content').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)">
      <button onclick="nav('suivi')" style="background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;line-height:1">‹</button>
      <div style="font-size:14px;font-weight:500;color:var(--w)">Mon calendrier</div>
    </div>
    <div class="sec" style="padding-left:0;padding-top:18px">Mes disponibilités</div>
    <div id="my-availability-box" class="card">Chargement…</div>
    <div class="sec" style="padding-left:0;padding-top:22px">Mon programme d'entraînement</div>
    <div id="my-program-list" class="card">Chargement…</div>
    <div style="height:24px"></div>
  `;
  await loadMyAvailabilityBox();
  await loadMyProgramList();
}

async function loadMyAvailabilityBox(){
  const el = document.getElementById('my-availability-box');
  if(!el) return;
  try{
    const { slots } = await callApi('getPlayerAvailability', {});
    const byDay = {};
    (slots||[]).forEach(s => { byDay[s.day_of_week] = s; });
    el.innerHTML = JOURS_SEMAINE.map((jour,di) => `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid var(--border)">
        <div style="width:80px;font-size:12px;color:var(--w2)">${jour}</div>
        <input class="finput" type="time" style="margin:0;flex:1" id="avail-start-${di}" value="${byDay[di]?.start_time||''}"/>
        <span style="color:var(--w3);font-size:12px">${APP_STATE.language==='en'?'to':'à'}</span>
        <input class="finput" type="time" style="margin:0;flex:1" id="avail-end-${di}" value="${byDay[di]?.end_time||''}"/>
      </div>`).join('') + `
      <div id="avail-msg" style="font-size:12px;color:var(--green);margin:8px 0 0"></div>
      <button class="gbtn full" style="margin-top:10px" onclick="saveMyAvailability()">Enregistrer mes disponibilités</button>
    `;
  }catch(e){
    el.innerHTML = `<div style="font-size:12px;color:var(--red)">Impossible de charger tes disponibilités.</div>`;
  }
}

async function saveMyAvailability(){
  const msgEl = document.getElementById('avail-msg');
  const slots = [];
  for(let di=0; di<7; di++){
    const start = document.getElementById('avail-start-'+di).value;
    const end = document.getElementById('avail-end-'+di).value;
    if(start && end) slots.push({ day_of_week: di, start_time: start, end_time: end });
  }
  try{
    await callApi('setMyAvailability', { slots });
    if(msgEl){ msgEl.textContent='Disponibilités enregistrées !'; setTimeout(()=>{ if(msgEl) msgEl.textContent=''; },2500); }
  }catch(e){ alert(tr(e.message)); }
}

async function loadMyProgramList(){
  const el = document.getElementById('my-program-list');
  if(!el) return;
  try{
    const { programs } = await callApi('getPlayerProgram', {});
    renderWeeklyProgram(el, programs||[], false, null);
  }catch(e){
    el.innerHTML = `<div style="font-size:12px;color:var(--red)">Impossible de charger le programme.</div>`;
  }
}

function renderWeeklyProgram(el, programs, isCoach, playerId){
  if(!programs.length){
    el.innerHTML = `<div style="font-size:12px;color:var(--w3)">${isCoach ? "Aucun entraînement programmé pour ce joueur." : "Ton coach n'a pas encore programmé d'entraînement."}</div>`;
    return;
  }
  const byDay = {};
  programs.forEach(p => { (byDay[p.day_of_week] = byDay[p.day_of_week]||[]).push(p); });
  el.innerHTML = JOURS_SEMAINE.map((jour,di) => {
    const items = byDay[di];
    if(!items || !items.length) return '';
    return `
    <div style="padding:8px 0;border-bottom:.5px solid var(--border)">
      <div style="font-size:11px;color:var(--gold2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">${jour}</div>
      ${items.map(p => `
      <div style="padding:2px 0 8px 10px;border-left:2px solid var(--border2);margin-bottom:4px">
        <div style="display:flex;justify-content:space-between;gap:8px">
          <span style="font-size:13px;color:var(--w)">${(p.title||'').replace(/</g,'&lt;')}</span>
          ${p.start_time?`<span style="font-size:11px;color:var(--w3);white-space:nowrap">${p.start_time.slice(0,5)}${p.end_time?'–'+p.end_time.slice(0,5):''}</span>`:''}
        </div>
        ${p.description ? `<div style="font-size:12px;color:var(--w2);margin-top:3px">${p.description.replace(/</g,'&lt;')}</div>` : ''}
        ${p.videos?.drive_url ? `<a href="${p.videos.drive_url}" target="_blank" style="font-size:12px;color:var(--gold2);margin-top:3px;display:inline-block">▶ ${(p.videos.title||'Vidéo').replace(/</g,'&lt;')}</a>` : ''}
        ${isCoach ? `<button class="ghost" style="color:var(--red);font-size:11px;padding:3px 8px;margin-top:4px" onclick="deleteTrainingProgramFor('${p.id}','${playerId}')">Supprimer</button>` : ''}
      </div>`).join('')}
    </div>`;
  }).join('');
}

async function loadPlayerAvailabilityBox(playerId){
  const el = document.getElementById('player-availability-box');
  if(!el) return;
  try{
    const { slots } = await callApi('getPlayerAvailability', { playerId });
    if(!slots || !slots.length){
      el.innerHTML = `<div style="font-size:12px;color:var(--w3)">Ce joueur n'a pas encore renseigné ses disponibilités.</div>`;
      return;
    }
    const byDay = {};
    slots.forEach(s => { byDay[s.day_of_week]=s; });
    el.innerHTML = JOURS_SEMAINE.map((jour,di) => byDay[di] ? `
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid var(--border);font-size:12px">
        <span style="color:var(--w2)">${jour}</span>
        <span style="color:var(--w3)">${byDay[di].start_time} – ${byDay[di].end_time}</span>
      </div>` : '').join('');
  }catch(e){
    el.innerHTML = `<div style="font-size:12px;color:var(--red)">Impossible de charger les disponibilités.</div>`;
  }
}

async function loadPlayerVideoSelect(){
  const el = document.getElementById('ts-video');
  if(!el) return;
  try{
    const { videos } = await callApi('listVideos', { category:'Tous' });
    el.innerHTML = `<option value="">Aucune vidéo de la Biblio</option>` + (videos||[]).map(v => `<option value="${v.id}">${(v.title||'').replace(/</g,'&lt;')}</option>`).join('');
  }catch(e){ /* champ optionnel */ }
}

async function addTrainingProgramForPlayer(playerId){
  const msgEl = document.getElementById('ts-msg');
  const days = [];
  for(let di=0; di<7; di++){
    const cb = document.getElementById('ts-day-'+di);
    if(cb && cb.checked) days.push(di);
  }
  const start_time = document.getElementById('ts-start').value;
  const end_time = document.getElementById('ts-end').value;
  const title = document.getElementById('ts-title').value.trim();
  const description = document.getElementById('ts-desc').value.trim();
  const video_id = document.getElementById('ts-video').value || null;
  if(!days.length || !title){ if(msgEl){ msgEl.style.color='var(--red)'; msgEl.textContent='Choisis au moins un jour et un titre.'; } return; }
  try{
    await callApi('addTrainingProgram', { playerId, days, start_time: start_time||null, end_time: end_time||null, title, description: description||null, video_id });
    document.getElementById('ts-title').value='';
    document.getElementById('ts-desc').value='';
    for(let di=0; di<7; di++){ const cb=document.getElementById('ts-day-'+di); if(cb) cb.checked=false; }
    if(msgEl){ msgEl.style.color='var(--green)'; msgEl.textContent='Entraînement ajouté !'; setTimeout(()=>{ if(msgEl) msgEl.textContent=''; },2500); }
    await loadPlayerProgramList(playerId);
  }catch(e){ if(msgEl){ msgEl.style.color='var(--red)'; msgEl.textContent = e.message; } }
}

async function loadPlayerProgramList(playerId){
  const el = document.getElementById('player-sessions-list');
  if(!el) return;
  try{
    const { programs } = await callApi('getPlayerProgram', { playerId });
    renderWeeklyProgram(el, programs||[], true, playerId);
  }catch(e){
    el.innerHTML = `<div class="card"><div style="font-size:12px;color:var(--red)">Impossible de charger le programme.</div></div>`;
  }
}

async function deleteTrainingProgramFor(programId, playerId){
  if(!confirm(tr('Supprimer cet entraînement récurrent ?'))) return;
  try{
    await callApi('deleteTrainingProgram', { programId });
    await loadPlayerProgramList(playerId);
  }catch(e){ alert(tr(e.message)); }
}

async function loadAiCriteria(){
  const el = document.getElementById('ai-criteria-input');
  if(!el) return;
  try{
    const { criteria } = await callApi('getAiCriteria', {});
    el.value = criteria || '';
  }catch(e){
    el.placeholder = 'Impossible de charger les critères.';
  }
}

async function saveAiCriteria(){
  const el = document.getElementById('ai-criteria-input');
  const msgEl = document.getElementById('ai-criteria-msg');
  const criteria = (el.value||'').trim();
  try{
    await callApi('updateAiCriteria', { criteria });
    if(msgEl){ msgEl.textContent='Critères enregistrés !'; setTimeout(()=>{ if(msgEl) msgEl.textContent=''; },2500); }
  }catch(e){ alert(tr(e.message)); }
}

  function openSettingsModal(){ const u=APP_STATE.user||{}; window._settingsLangSelected=APP_STATE.language||'fr'; document.getElementById('content').innerHTML=`<div class="overlay"><div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1.5px">Paramètres</div><button onclick="render()" style="background:none;border:none;color:var(--w3);font-size:22px;cursor:pointer">✕</button></div><div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">Prénom</div><input class="finput" id="profile-first-name" value="${(u.firstName||'').replace(/"/g,'&quot;')}"/><div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px">Nom</div><input class="finput" id="profile-last-name" value="${(u.lastName||'').replace(/"/g,'&quot;')}"/><div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px">Équipe</div><input class="finput" id="profile-team" value="${(u.team||'').replace(/"/g,'&quot;')}"/><div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px">Niveau</div><input class="finput" id="profile-level" value="${(u.level||'').replace(/"/g,'&quot;')}"/><div style="font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px">Langue</div><div style="display:flex;gap:8px"><button type="button" class="gbtn" id="settings-lang-fr" style="flex:1" onclick="setSettingsLangUI('fr')">Français</button><button type="button" class="gbtn" id="settings-lang-en" style="flex:1" onclick="setSettingsLangUI('en')">English</button></div><div id="profile-info-msg" style="font-size:12px;margin-top:10px;min-height:16px"></div><button class="gbtn full" style="margin-top:14px" onclick="saveProfileInfo()">Enregistrer les modifications</button></div></div>`; setSettingsLangUI(APP_STATE.language||'fr'); } function setSettingsLangUI(lang){ window._settingsLangSelected=lang; const fr=document.getElementById('settings-lang-fr'); const en=document.getElementById('settings-lang-en'); if(fr) fr.style.cssText='flex:1;'+(lang==='fr'?'background:var(--gold2);color:#111':''); if(en) en.style.cssText='flex:1;'+(lang==='en'?'background:var(--gold2);color:#111':''); } async function saveProfileInfo(){ const fnEl=document.getElementById('profile-first-name'); const lnEl=document.getElementById('profile-last-name'); const teamEl=document.getElementById('profile-team'); const levelEl=document.getElementById('profile-level'); const msgEl=document.getElementById('profile-info-msg'); const first_name=(fnEl.value||'').trim(); const last_name=(lnEl.value||'').trim(); const team=(teamEl.value||'').trim(); const level=(levelEl.value||'').trim(); const newLang=window._settingsLangSelected||APP_STATE.language||'fr'; if(!first_name||!last_name){ if(msgEl){ msgEl.style.color='var(--red)'; msgEl.textContent='Prénom et nom requis.'; } return; } try{ const { profile } = await callApi('updateProfile', { first_name, last_name, team, level }); APP_STATE.user.name = `${profile.first_name||''} ${profile.last_name||''}`.trim(); APP_STATE.user.firstName = profile.first_name||''; APP_STATE.user.lastName = profile.last_name||''; APP_STATE.user.team = profile.team||''; APP_STATE.user.level = profile.level; if(newLang!==APP_STATE.language){ await switchLanguage(newLang); } else { render(); } }catch(e){ if(msgEl){ msgEl.style.color='var(--red)'; msgEl.textContent=tr(e.message); } } }

<div class="sec" style="padding-left:0;padding-top:22px">Compte</div>
