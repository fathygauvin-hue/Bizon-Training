function enterIronmanStation(session, splits, stations){
  const currentIndex = splits.length + 1;
  ironmanStopTimer();
  IRONMAN_CTX = { session, stations, currentIndex, startedAtMs: new Date(session.started_at).getTime(), timerInterval: null };
  if(currentIndex > stations.length){ const backId = _regShootingBack(openIronmanHub); return renderIronmanSummary(session, backId); }
  renderIronmanStation();
  ironmanStartTimer();
}

function renderIronmanStation(){
  const { stations, currentIndex } = IRONMAN_CTX;
  const station = stations[currentIndex - 1];
  const total = stations.length;
  const phase = currentIndex <= 20 ? 'Descente' : (currentIndex <= 24 ? 'Point bas' : 'Remontée');
  const dotsRow = stations.map((st,i) => '<div style="width:'+(i+1===currentIndex?'8px':'5px')+';height:'+(i+1===currentIndex?'8px':'5px')+';border-radius:50%;background:'+(i+1<currentIndex?'var(--gold)':(i+1===currentIndex?'var(--gold2)':'var(--border2)'))+'"></div>').join('');
  let body, btnLabel;
  if(station.type === 'course'){
    body = '<div style="text-align:center;padding:20px 0"><div style="font-size:40px;margin-bottom:8px">🏃</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:28px;color:var(--gold);letter-spacing:1px">'+station.target+' allers-retours</div><div style="font-size:12px;color:var(--w3);margin-top:6px">Longueur de terrain de basket</div></div>';
    btnLabel = 'Course terminée';
  } else {
    const ex = IRONMAN_EXERCISES[station.type];
    body = '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 0">'+ex.svg+'<div style="text-align:center"><div style="font-size:16px;font-weight:600;color:var(--w)">'+ex.name+'</div><div style="font-size:12px;color:var(--red);margin-top:2px">'+ex.muscle+'</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:24px;color:var(--gold);margin-top:6px">'+station.target+' répétitions</div></div></div>';
    btnLabel = 'Série terminée';
  }
  document.getElementById('content').innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)"><button onclick="confirmCancelIronman()" style="background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;line-height:1">‹</button><div style="font-size:14px;font-weight:500;color:var(--w)">Iron Man</div></div>' +
    '<div style="padding:14px 0 4px;text-align:center;font-size:11px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px">'+phase+' · Palier '+currentIndex+'/'+total+'</div>' +
    '<div id="ironman-chrono" style="text-align:center;font-family:\'Bebas Neue\',sans-serif;font-size:36px;color:var(--gold);padding:6px 0">00:00</div>' +
    '<div class="card">' + body +
      '<button class="gbtn full" style="margin-top:8px" onclick="submitIronmanStation()">'+btnLabel+'</button>' +
    '</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:16px 24px 8px">'+dotsRow+'</div>';
}

async function submitIronmanStation(){
  if(!IRONMAN_CTX) return;
  ironmanStopTimer();
  const elapsed = (Date.now() - IRONMAN_CTX.startedAtMs) / 1000;
  try{
    const r = await callApi('advanceIronmanStation', { session_id: IRONMAN_CTX.session.id, elapsed_seconds: elapsed });
    if(r.done){
      const backId = _regShootingBack(openIronmanHub);
      renderIronmanSummary(r.session, backId);
    } else {
      const activeR = await callApi('getActiveIronmanSession', {});
      enterIronmanStation(activeR.session, activeR.splits, activeR.stations);
    }
  }catch(e){ alert(tr(e.message)); ironmanStartTimer(); }
}

function confirmCancelIronman(){
  if(!IRONMAN_CTX){ openIronmanHub(); return; }
  if(confirm(tr('Abandonner cette séance ? La progression sera perdue.'))){
    ironmanStopTimer();
    const sid = IRONMAN_CTX.session.id;
    callApi('cancelIronmanSession', { session_id: sid }).catch(() => {}).finally(() => { IRONMAN_CTX = null; openIronmanHub(); });
  } else {
    ironmanStartTimer();
  }
}

function renderIronmanSummary(session, backId){
  const t = ironmanFormatTime(session.total_duration_seconds || 0);
  document.getElementById('content').innerHTML =
    '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--border)"><div style="font-size:14px;font-weight:500;color:var(--w)">Iron Man — Résumé</div></div>' +
    '<div class="card" style="text-align:center;margin-top:16px"><div style="font-size:12px;color:var(--w3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">Temps total</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:48px;color:var(--gold)">'+t+'</div><div style="font-size:12px;color:var(--w3);margin-top:10px">Circuit complet : 37 paliers</div></div>' +
    '<button class="gbtn full" style="margin-top:16px" onclick="goShootingBackId(\''+backId+'\')">Terminé</button>';
}

async function viewIronmanSessionDetail(sessionId, backId){
  document.getElementById('content').innerHTML = '<div style="padding:20px 0;text-align:center;color:var(--w3);font-size:12px"><span class="skel-bar"></span></div>';
  try{ const { session } = await callApi('getIronmanSessionDetail', { session_id: sessionId }); renderIronmanSummary(session, backId); }catch(e){ alert(tr(e.message)); goShootingBackId(backId); }
}

async function loadPlayerIronmanBox(playerId, playerName){
  const el = document.getElementById('player-ironman-box');
  if(!el) return;
  try{
    const { sessions } = await callApi('listIronmanSessions', { playerId });
    if(!sessions || !sessions.length){ el.innerHTML = '<div style="font-size:12px;color:var(--w3)">Aucune séance Iron Man enregistrée pour ce joueur.</div>'; return; }
    const backId = _regShootingBack(() => openPlayerDetail(playerId, playerName));
    el.innerHTML = sessions.map(s => {
      const d = new Date(s.completed_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
      const t = ironmanFormatTime(s.total_duration_seconds || 0);
      return '<div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 0;border-bottom:.5px solid var(--border)" onclick="viewIronmanSessionDetail(\''+s.id+'\',\''+backId+'\')"><div><div style="font-size:13px;font-weight:500;color:var(--w)">'+d+'</div><div style="font-size:11px;color:var(--w3);margin-top:2px">Circuit complet</div></div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:18px;color:var(--gold)">'+t+'</div></div>';
    }).join('');
  }catch(e){ el.innerHTML = '<div style="font-size:12px;color:var(--red)">'+tr(e.message)+'</div>'; }
}
</script>
</body>
</html>
